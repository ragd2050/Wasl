<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>استبيان الحالة | وصل</title>
    <link rel="stylesheet" href="assets/wasl-fonts.css" />
    <link rel="stylesheet" href="assets/wasl-enhance.css" />
    <style>
      :root {
        --navy: #112d72;
        --violet: #5754e9;
        --blue: #1597ed;
        --cyan: #08d8d2;
        --bg: #f4f7fc;
        --muted: #6f7b90;
        --line: #dfe6f1;
        --soft: #f7f9fd;
        --green: #16865b;
        --red: #bc3545;
        --shadow: 0 20px 55px rgba(17, 45, 114, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Tajawal", sans-serif;
        color: #17213b;
        background: var(--bg);
      }
      body {
        overflow: hidden;
      }
      .app {
        height: 100dvh;
        display: grid;
        grid-template-rows: 68px 1fr;
        background: radial-gradient(circle at 4% 92%, rgba(8, 216, 210, 0.12), transparent 25%), var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(24px, 5vw, 70px);
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        width: 126px;
        height: 48px;
        object-fit: contain;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .secure {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--green);
        font-size: 0.78rem;
      }
      .secure i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
      }
      .lang {
        height: 39px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--navy);
        font-weight: 800;
        cursor: pointer;
      }
      main {
        min-height: 0;
        padding: 20px clamp(22px, 5vw, 76px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shell {
        width: min(1080px, 100%);
        height: min(680px, calc(100dvh - 108px));
        min-height: 570px;
        padding: 30px clamp(30px, 5vw, 60px);
        border: 1px solid var(--line);
        border-radius: 25px;
        background: #fff;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
      }
      .top {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 28px;
        align-items: center;
        padding-bottom: 17px;
        border-bottom: 1px solid var(--line);
      }
      .patient {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        background: #e9edff;
        color: var(--violet);
        font-weight: 800;
        line-height: 1;
      }
      .patient strong {
        display: block;
        color: var(--navy);
        font-size: 0.9rem;
      }
      .patient span {
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 0.75rem;
      }
      .track {
        height: 7px;
        border-radius: 99px;
        background: #edf1f7;
        overflow: hidden;
      }
      .bar {
        height: 100%;
        width: 4%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--violet));
        transition: 0.25s;
      }
      .question-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding-top: 27px;
      }
      .section {
        display: inline-flex;
        align-self: flex-start;
        padding: 6px 10px;
        border-radius: 999px;
        background: #efefff;
        color: var(--violet);
        font-size: 0.74rem;
        font-weight: 800;
      }
      .question {
        margin: 13px 0 6px;
        color: var(--navy);
        font-size: clamp(1.45rem, 2.7vw, 2.05rem);
        line-height: 1.4;
      }
      .help {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }
      .answer {
        margin-top: 22px;
      }
      .options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .options.many {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .option {
        min-height: 54px;
        padding: 10px 15px;
        border: 1.5px solid var(--line);
        border-radius: 13px;
        background: #fff;
        color: var(--navy);
        font:
          700 0.83rem "Tajawal",
          sans-serif;
        text-align: start;
        cursor: pointer;
        transition: 0.15s;
      }
      .option:hover {
        border-color: #9eb3e8;
        background: #fafbff;
      }
      .option.selected {
        border-color: var(--blue);
        background: #edf6ff;
        box-shadow: 0 0 0 3px rgba(21, 151, 237, 0.08);
      }
      .option.selected:before {
        content: "✓";
        display: inline-grid;
        place-items: center;
        width: 21px;
        height: 21px;
        margin-inline-end: 8px;
        border-radius: 7px;
        background: var(--blue);
        color: #fff;
        font-size: 0.7rem;
      }
      .field {
        width: 100%;
        min-height: 58px;
        padding: 15px 17px;
        border: 1.5px solid var(--line);
        border-radius: 13px;
        background: #fff;
        color: var(--navy);
        font:
          600 0.9rem "Tajawal",
          sans-serif;
        outline: none;
        resize: none;
      }
      .field:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(21, 151, 237, 0.08);
      }
      textarea.field {
        min-height: 118px;
      }
      .tip {
        margin-top: 8px;
        color: #8a95a8;
        font-size: 0.7rem;
      }
      .error {
        min-height: 20px;
        margin-top: 9px;
        color: var(--red);
        font-size: 0.76rem;
        font-weight: 700;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
        padding-top: 14px;
      }
      .nav {
        display: flex;
        gap: 9px;
      }
      .primary,
      .secondary {
        height: 47px;
        padding: 0 23px;
        border-radius: 12px;
        font:
          700 0.88rem "Tajawal",
          sans-serif;
        cursor: pointer;
      }
      .primary {
        min-width: 160px;
        border: 0;
        color: #fff;
        background: linear-gradient(105deg, var(--navy), var(--violet));
        box-shadow: 0 9px 20px rgba(87, 84, 233, 0.18);
      }
      .secondary {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--navy);
      }
      .secondary:disabled {
        opacity: 0.35;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translate(-50%, 20px);
        opacity: 0;
        padding: 11px 17px;
        border-radius: 11px;
        background: #17213b;
        color: #fff;
        font-size: 0.8rem;
        transition: 0.2s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 760px) {
        body {
          overflow: auto;
        }
        .app {
          height: auto;
          min-height: 100dvh;
        }
        .secure {
          display: none;
        }
        main {
          padding: 14px;
        }
        .shell {
          height: auto;
          min-height: calc(100dvh - 96px);
          padding: 24px 19px;
        }
        .top {
          grid-template-columns: 1fr;
        }
        .question-area {
          min-height: 510px;
        }
        .options,
        .options.many {
          grid-template-columns: 1fr;
        }
        .actions {
          align-items: stretch;
          flex-direction: column-reverse;
          gap: 10px;
        }
        .nav {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .primary,
        .secondary {
          width: 100%;
          min-width: 0;
        }
        .logo {
          width: 104px;
        }
      }

      .ini {
        width: 100%;
        height: 100%;
        display: block;
      }
      .ini text {
        fill: currentColor;
        font-weight: 800;
        font-size: 50px;
        font-family: Tajawal, sans-serif;
      }
      .why-ask {
        margin-top: 12px;
      }
      .why-ask button {
        border: 0;
        background: none;
        color: #1f6feb;
        font-weight: 800;
        cursor: pointer;
        font-family: inherit;
        font-size: 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0;
      }
      .why-ask button svg {
        width: 15px;
        height: 15px;
      }
      .why-ask .wa-body {
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 12px;
        background: #eef4ff;
        border: 1px solid #d7e5ff;
        color: #274a86;
        font-size: 0.84rem;
        line-height: 1.7;
        font-weight: 600;
        display: none;
      }
      .why-ask.open .wa-body {
        display: block;
      }
    </style>
    <script src="assets/wasl-store.js"></script>
    <script src="assets/wasl-api.js"></script>
    <script src="assets/wasl-red-flags.js"></script>
    <script defer src="assets/wasl-enhance.js"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <img class="logo" src="assets/wasl-logo-1.webp" alt="منصة وصل" />
        <div class="tools"><button class="lang" id="langBtn">EN</button></div>
      </header>
      <main>
        <section class="shell">
          <div class="top">
            <div class="patient">
              <span class="avatar"
                ><svg class="ini" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                  <text x="50" y="50" text-anchor="middle" dominant-baseline="central" data-ar="س" data-en="S">س</text>
                </svg></span
              >
              <div>
                <strong data-ar="سارة عبدالله العتيبي" data-en="Sara Abdullah Al-Otaibi">سارة عبدالله العتيبي</strong
                ><span data-ar="6 سنوات · الزيارة الأولى" data-en="6 years · First visit"
                  >6 سنوات · الزيارة الأولى</span
                >
              </div>
            </div>
            <div>
              <div class="progress-label"><span id="progressText"></span><span id="progressCount"></span></div>
              <div class="track"><div class="bar" id="bar"></div></div>
            </div>
          </div>
          <div class="question-area">
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
              <span class="section" id="section"></span
              ><button class="wasl-speak" data-speak="#question" type="button">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                  <path d="M16 9a3 3 0 0 1 0 6M18.5 6.5a7 7 0 0 1 0 11" />
                </svg>
              </button>
            </div>
            <h1 class="question" id="question" data-speak-auto></h1>
            <p class="help" id="help"></p>
            <div class="answer" id="answer"></div>
            <div class="error" id="error"></div>
            <div class="actions">
              <button class="secondary" id="saveBtn" data-ar="حفظ والخروج مؤقتًا" data-en="Save and exit">
                حفظ والخروج مؤقتًا
              </button>
              <div class="nav">
                <button class="secondary" id="prevBtn" data-ar="رجوع" data-en="Back">رجوع</button
                ><button class="primary" id="nextBtn" data-ar="متابعة" data-en="Continue">متابعة</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      const S = {
        history: { ar: "تاريخ الحالة", en: "Case history" },
        concern: { ar: "نوع المشكلة", en: "Main concerns" },
        hearing: { ar: "السمع", en: "Hearing" },
        language: { ar: "مهارات اللغة والنطق", en: "Speech and language skills" },
        oral: { ar: "المضغ والبلع وعضلات الوجه والفم", en: "Chewing, swallowing and oral motor skills" },
      };
      const yn = [
          { v: "no", ar: "لا", en: "No" },
          { v: "yes", ar: "نعم", en: "Yes" },
        ],
        freq = [
          { v: "yes", ar: "نعم", en: "Yes" },
          { v: "sometimes", ar: "أحيانًا", en: "Sometimes" },
          { v: "no", ar: "لا", en: "No" },
        ];
      const questions = [
        {
          id: "grade",
          s: "history",
          q: { ar: "ما الصف الدراسي الذي تدرس فيه سارة؟", en: "What grade is Sara currently in?" },
          h: {
            ar: "إذا لم يلتحق الطفل بالمدرسة بعد، يمكن اختيار «لا ينطبق».",
            en: "Choose “Not applicable” if she has not started school.",
          },
          type: "single",
          o: [
            { v: "na", ar: "لا ينطبق", en: "Not applicable" },
            { v: "kg", ar: "روضة أو تمهيدي", en: "Kindergarten" },
            { v: "g1", ar: "الصف الأول", en: "Grade 1" },
            { v: "other", ar: "صف آخر", en: "Another grade" },
          ],
        },
        {
          id: "respondent",
          s: "history",
          q: { ar: "ما صلة الشخص الذي يعبّئ الاستبيان بالطفلة؟", en: "Who is completing this questionnaire?" },
          type: "single",
          o: [
            { v: "mother", ar: "الأم", en: "Mother" },
            { v: "father", ar: "الأب", en: "Father" },
            { v: "sibling", ar: "الأخ أو الأخت", en: "Sibling" },
            { v: "relative", ar: "قريب آخر أو مقدّم رعاية", en: "Other relative or caregiver" },
          ],
        },
        {
          id: "home_lang",
          s: "history",
          q: { ar: "ما اللغة المستخدمة غالبًا في المنزل؟", en: "Which language is mainly used at home?" },
          type: "single",
          o: [
            { v: "ar", ar: "العربية", en: "Arabic" },
            { v: "en", ar: "الإنجليزية", en: "English" },
            { v: "both", ar: "العربية والإنجليزية", en: "Arabic and English" },
            { v: "other", ar: "لغة أخرى", en: "Another language" },
          ],
        },
        {
          id: "family_history",
          s: "history",
          q: {
            ar: "هل سبق أن واجه أحد أفراد الأسرة مشكلات في اللغة أو النطق؟",
            en: "Has anyone in the family had speech or language difficulties?",
          },
          type: "single",
          o: yn,
        },
        {
          id: "family_details",
          s: "history",
          q: { ar: "اذكر صلة القرابة ونوع المشكلة باختصار.", en: "Briefly describe the relative and the difficulty." },
          type: "textarea",
          when: (a) => a.family_history === "yes",
        },
        {
          id: "health_history",
          s: "history",
          q: {
            ar: "هل لدى سارة حالة صحية مزمنة أو اضطراب نمائي، أو سبق أن أجرت عملية جراحية؟",
            en: "Does Sara have a chronic condition, developmental disorder, or previous surgery?",
          },
          h: {
            ar: "مثل عمليات اللوز أو اللحمية، الشفة الأرنبية أو شق الحنك، أو الحبال الصوتية.",
            en: "For example tonsils, adenoids, cleft lip or palate, or vocal cords.",
          },
          type: "single",
          o: yn,
        },
        {
          id: "health_details",
          s: "history",
          q: {
            ar: "يرجى ذكر الحالة الصحية أو العملية وتاريخها إن أمكن.",
            en: "Describe the condition or surgery and its date, if known.",
          },
          type: "textarea",
          when: (a) => a.health_history === "yes",
        },
        {
          id: "therapy",
          s: "history",
          q: { ar: "هل حصلت سارة سابقًا على جلسات علاج؟", en: "Has Sara previously received therapy?" },
          h: {
            ar: "يشمل علاج التخاطب أو العلاج الطبيعي أو الوظيفي أو السلوكي.",
            en: "Including speech, physical, occupational, or behavioral therapy.",
          },
          type: "single",
          o: yn,
        },
        {
          id: "therapy_details",
          s: "history",
          q: {
            ar: "ما نوع العلاج؟ ومتى بدأ وكم كانت مدته؟",
            en: "What type of therapy, when did it start, and for how long?",
          },
          type: "textarea",
          when: (a) => a.therapy === "yes",
        },
        {
          id: "concerns",
          s: "concern",
          q: { ar: "ما الصعوبات التي تلاحظها على سارة؟", en: "Which difficulties have you noticed in Sara?" },
          h: { ar: "يمكن اختيار أكثر من خيار.", en: "You may select more than one." },
          type: "multi",
          o: [
            { v: "hearing", ar: "سماع الأصوات أو تمييزها", en: "Hearing or distinguishing sounds" },
            {
              v: "understanding",
              ar: "فهم الكلام أو الأوامر أو الإشارات",
              en: "Understanding speech, instructions, or gestures",
            },
            {
              v: "social",
              ar: "التواصل الاجتماعي والبصري أو مهارات اللعب",
              en: "Social/visual communication or play skills",
            },
            {
              v: "language",
              ar: "اكتساب الكلمات أو استخدامها وتكوين الجمل",
              en: "Learning/using words and forming sentences",
            },
            { v: "clarity", ar: "صعوبة الآخرين في فهم كلامها", en: "Others have difficulty understanding her speech" },
            { v: "sounds", ar: "نطق أو إنتاج بعض الأصوات الكلامية", en: "Producing certain speech sounds" },
            { v: "fluency", ar: "طلاقة أو استرسال الكلام", en: "Speech fluency" },
            { v: "feeding", ar: "المضغ أو البلع أو عضلات الفم", en: "Chewing, swallowing, or oral motor skills" },
          ],
        },
        {
          id: "regression",
          s: "history",
          q: {
            ar: "هل توقفت سارة مؤخرًا عن استخدام كلمات أو مهارات تواصل كانت تستخدمها من قبل؟",
            en: "Has Sara recently lost words or communication skills she previously used?",
          },
          h: {
            ar: "نقصد تغيرًا ملحوظًا ومفاجئًا، وليس اختلافًا بسيطًا من يوم لآخر.",
            en: "This means a noticeable, sudden change rather than a small day-to-day difference.",
          },
          type: "single",
          o: yn,
        },
        {
          id: "hearing_problem",
          s: "hearing",
          q: { ar: "هل تعاني سارة من صعوبة أو مشكلة في السمع؟", en: "Does Sara have a hearing difficulty?" },
          type: "single",
          o: yn,
          when: (a) => has(a, "hearing"),
        },
        {
          id: "sudden_hearing",
          s: "hearing",
          q: {
            ar: "هل ظهرت صعوبة السمع أو تغيّرت بشكل مفاجئ؟",
            en: "Did the hearing difficulty begin or change suddenly?",
          },
          type: "single",
          o: yn,
          when: (a) => a.hearing_problem === "yes",
        },
        {
          id: "hearing_aid",
          s: "hearing",
          q: { ar: "هل تستخدم سارة معينات سمعية؟", en: "Does Sara use hearing aids?" },
          type: "single",
          o: yn,
          when: (a) => a.hearing_problem === "yes",
        },
        {
          id: "ear_infections",
          s: "hearing",
          q: { ar: "هل لدى سارة التهابات متكررة في الأذن؟", en: "Does Sara have recurrent ear infections?" },
          type: "single",
          o: yn,
          when: (a) => has(a, "hearing"),
        },
        {
          id: "ear_treatment",
          s: "hearing",
          q: {
            ar: "ما العلاج الذي تلقته لالتهابات الأذن؟",
            en: "What treatment did she receive for the ear infections?",
          },
          h: {
            ar: "مثل عملية، قطرة، مضاد حيوي، أو علاج آخر.",
            en: "For example surgery, drops, antibiotics, or another treatment.",
          },
          type: "textarea",
          when: (a) => a.ear_infections === "yes",
        },
        {
          id: "sound_response",
          s: "hearing",
          q: {
            ar: "هل تستجيب سارة لنداء اسمها وللأصوات المحيطة مثل الجرس أو السيارة؟",
            en: "Does Sara respond to her name and environmental sounds such as a bell or car?",
          },
          type: "single",
          o: freq,
          when: (a) => has(a, "hearing"),
        },
        {
          id: "hearing_test",
          s: "hearing",
          q: {
            ar: "هل أجرت سارة فحصًا أو مسحًا سمعيًا خلال الأشهر الثلاثة الماضية؟",
            en: "Has Sara had a hearing screening in the past three months?",
          },
          type: "single",
          o: yn,
          when: (a) => has(a, "hearing"),
        },
        {
          id: "hearing_result",
