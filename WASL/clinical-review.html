<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مراجعة المختص السريرية | وصل</title>
    <link rel="stylesheet" href="assets/wasl-fonts.css" />
    <link rel="stylesheet" href="assets/wasl-enhance.css" />
    <style>
      :root {
        --navy: #112d72;
        --violet: #5754e9;
        --blue: #1597ed;
        --cyan: #08d8d2;
        --bg: #eef2f8;
        --muted: #6f7b90;
        --line: #dfe6f1;
        --soft: #f7f9fd;
        --green: #16865b;
        --red: #df4c60;
        --amber: #a55b12;
        --shadow: 0 20px 55px rgba(17, 45, 114, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Tajawal", sans-serif;
        color: #17213b;
        background: var(--bg);
      }
      .app {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: 64px 1fr;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(18px, 4vw, 42px);
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 112px;
        height: 44px;
        object-fit: contain;
      }
      .role {
        font-size: 0.74rem;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(105deg, var(--navy), var(--violet));
        padding: 5px 12px;
        border-radius: 999px;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .back-cases {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--navy);
        font:
          800 0.8rem "Tajawal",
          sans-serif;
        text-decoration: none;
      }
      .back-cases svg {
        width: 16px;
        height: 16px;
      }
      html[dir="ltr"] .back-cases svg {
        transform: scaleX(-1);
      }
      .lang {
        height: 37px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--navy);
        font-weight: 800;
        cursor: pointer;
      }
      .demo-flag {
        text-align: center;
        background: #132a63;
        color: #dfe7ff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 4px;
        letter-spacing: 0.3px;
      }
      main {
        padding: 18px clamp(14px, 3.5vw, 40px);
      }
      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.95fr);
        gap: 18px;
        align-items: start;
      }
      .wrap.is-empty {
        min-height: calc(100dvh - 100px);
        grid-template-columns: minmax(0, 680px);
        place-content: center;
      }
      .legal {
        grid-column: 1/-1;
        display: flex;
        gap: 11px;
        align-items: flex-start;
        padding: 12px 16px;
        border-radius: 14px;
        background: #fff7ea;
        border: 1px solid #ffe3ad;
        color: var(--amber);
        font-size: 0.84rem;
        line-height: 1.7;
        font-weight: 700;
      }
      .legal svg {
        flex: none;
        width: 20px;
        height: 20px;
        margin-top: 1px;
      }
      .col {
        display: grid;
        gap: 16px;
        min-width: 0;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 18px 20px;
      }
      .card h2 {
        margin: 0 0 12px;
        color: var(--navy);
        font-size: 1.05rem;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card h2 .n {
        font-size: 0.68rem;
        font-weight: 800;
        color: #fff;
        background: var(--violet);
        border-radius: 7px;
        padding: 2px 8px;
      }
      .kv {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 16px;
        font-size: 0.88rem;
      }
      .kv dt {
        color: var(--muted);
        font-weight: 700;
      }
      .kv dd {
        margin: 0;
        color: #26314d;
        font-weight: 600;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 11px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 800;
      }
      .pill.ok {
        background: #e8f7ef;
        color: #136c4c;
      }
      .pill.warn {
        background: #fff2e6;
        color: #a55b12;
      }
      .pill.bad {
        background: #fdeef0;
        color: #b23046;
      }
      .pill.info {
        background: #e9edff;
        color: #4b46c7;
      }
      .answers {
        display: grid;
        gap: 8px;
      }
      .answers .a {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 12px;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 11px;
        font-size: 0.85rem;
      }
      .answers .a b {
        color: var(--muted);
        font-weight: 700;
      }
      .rec {
        display: grid;
        gap: 11px;
      }
      .rec .r {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--soft);
      }
      .rec .r .rh {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .rec .r .rh b {
        color: var(--navy);
      }
      .rec audio {
        width: 100%;
        height: 38px;
      }
      .wave-tools {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }
      .wave-canvas {
        display: block;
        width: 100%;
        height: 92px;
        border-radius: 9px;
        background: #f7f9fd;
        cursor: pointer;
      }
      .wave-controls,
      .wave-note-form {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .wave-controls button,
      .wave-note,
      .wave-add {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: var(--navy);
        font: 700 0.72rem "Tajawal";
        cursor: pointer;
      }
      .wave-controls button {
        min-width: 42px;
        height: 31px;
      }
      .wave-controls button.active {
        color: #fff;
        border-color: var(--violet);
        background: var(--violet);
      }
      .wave-current {
        margin-inline-start: auto;
        color: var(--muted);
        direction: ltr;
        unicode-bidi: isolate;
      }
      .wave-note-form input {
        min-width: 170px;
        flex: 1;
        height: 38px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        font: 600 0.76rem "Tajawal";
      }
      .wave-add {
        min-height: 38px;
        padding: 0 13px;
        background: #eef1ff;
      }
      .wave-notes {
        display: grid;
        gap: 6px;
        margin-top: 8px;
      }
      .wave-note {
        width: 100%;
        padding: 7px 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: start;
      }
      .wave-note b {
        color: var(--violet);
        direction: ltr;
      }
      .wave-empty {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.72rem;
      }
      .q-chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .q-chip {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 8px;
        background: #eef1f7;
        color: #5a6b82;
      }
      .q-chip.bad {
        background: #fdeef0;
        color: #b23046;
      }
      .q-chip.ok {
        background: #e8f7ef;
        color: #136c4c;
      }
      .ind {
        display: grid;
        gap: 9px;
      }
      .ind .i {
        padding: 11px 13px;
        border: 1px solid #e4d8ff;
        border-radius: 12px;
        background: #f6f2ff;
      }
      .ind .i b {
        color: #4b3aa8;
      }
      .ind .i .src {
        margin-top: 5px;
        font-size: 0.72rem;
        color: #8a7fce;
      }
      .feat {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        font-size: 0.82rem;
      }
      .feat .f {
        padding: 9px 11px;
        background: var(--soft);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .feat .f b {
        display: block;
        color: var(--muted);
        font-weight: 700;
        font-size: 0.72rem;
      }
      .feat .f span {
        color: var(--navy);
        font-weight: 800;
        font-size: 1rem;
      }
      .fac {
        display: grid;
        gap: 9px;
      }
      .fac .fc {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 0.85rem;
      }
      .fac .fc.top {
        border-color: #bfe6d2;
        background: #f2fbf6;
      }
      .fac .fc small {
        color: var(--muted);
      }
      /* decision panel */
      .decision {
        position: sticky;
        top: 16px;
      }
      .field {
        margin-bottom: 14px;
      }
      .field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--navy);
        margin-bottom: 6px;
      }
      .field select,
      .field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 10px 12px;
        font: 600 0.88rem "Tajawal";
        color: #26314d;
        background: #fff;
      }
      .field textarea {
        min-height: 78px;
        resize: vertical;
      }
      .conf-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.84rem;
        margin-bottom: 6px;
      }
      .conf-bar {
        height: 8px;
        border-radius: 99px;
        background: #edf1f7;
        overflow: hidden;
      }
      .conf-bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--cyan), var(--violet));
      }
      .model-samples {
        display: grid;
        gap: 12px;
      }
      .model-sample {
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 13px;
        background: #fbfdff;
      }
      .model-sample h3 {
        margin: 0 0 10px;
        color: var(--navy);
        font-size: 0.95rem;
      }
      .model-output {
        display: grid;
        grid-template-columns: minmax(150px, 1fr) auto auto;
        align-items: center;
        gap: 9px;
        padding: 9px 0;
        border-top: 1px solid #e9eef6;
        font-size: 0.82rem;
      }
      .model-output:first-of-type {
        border-top: 0;
      }
      .model-number {
        direction: ltr;
        unicode-bidi: isolate;
        color: #42516f;
        white-space: nowrap;
      }
      .limits {
        padding: 12px 14px;
        border-radius: 12px;
        background: #fff8e8;
        border: 1px solid #f5db9c;
        color: #6f5316;
        line-height: 1.75;
        font-size: 0.84rem;
      }
      .plan-list {
        margin: 0 0 12px;
        padding-inline-start: 24px;
        color: #34415d;
        line-height: 1.85;
        font-size: 0.88rem;
      }
      .plan-list li + li {
        margin-top: 5px;
      }
      .btns {
        display: grid;
        gap: 9px;
        margin-top: 6px;
      }
      .btns button {
        height: 46px;
        border-radius: 12px;
        font: 800 0.88rem "Tajawal";
        cursor: pointer;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--navy);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .btns button.primary {
        border: 0;
        color: #fff;
        background: linear-gradient(105deg, var(--navy), var(--violet));
      }
      .btns button.retake {
        color: #a55b12;
        border-color: #ffd9a8;
        background: #fff7ea;
      }
      .decided {
        margin-top: 10px;
        padding: 11px;
        border-radius: 11px;
        background: #e8f7ef;
        border: 1px solid #bfe6d2;
        color: #136c4c;
        font-size: 0.83rem;
        font-weight: 700;
        display: none;
      }
      .decided.show {
        display: block;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translate(-50%, 20px);
        opacity: 0;
        padding: 11px 17px;
        border-radius: 11px;
        background: #17213b;
        color: #fff;
        font-size: 0.8rem;
        transition: 0.2s;
        z-index: 40;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 940px) {
        .wrap {
          grid-template-columns: 1fr;
        }
        .decision {
          position: static;
        }
        .feat {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 480px) {
        .back-cases span {
          display: none;
        }
        .back-cases {
          padding: 0 10px;
        }
        .rh b {
          overflow-wrap: anywhere;
        }
        .q-chips {
          flex-wrap: wrap;
        }
        .model-output {
          grid-template-columns: 1fr auto;
        }
        .model-number {
          grid-column: 1 / -1;
        }
      }
    
    @media (max-width: 480px) {
      header {
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 12px;
      }
      .wrap {
        padding-left: 10px;
        padding-right: 10px;
      }
      .card {
        padding: 14px;
      }
      .back-cases span {
        display: none;
      }
      .kv {
        grid-template-columns: 1fr;
      }
      .q-chips {
        flex-wrap: wrap;
      }
    }
</style>
    <script src="assets/wasl-store.js"></script>
    <script src="assets/wasl-api.js"></script>
    <script src="assets/wasl-sim.js"></script>
    <script src="assets/wasl-patient.js"></script>
    <script src="assets/wasl-waveform.js"></script>
    <script defer src="assets/wasl-enhance.js"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="brand">
          <img class="logo" src="assets/wasl-logo-1.webp" alt="وصل" /><span
            class="role"
            data-ar="لوحة المختص"
            data-en="Specialist dashboard"
            >لوحة المختص</span
          >
        </div>
        <div class="tools">
          <a
            class="back-cases"

            data-ar="سجل المتابعة"

            ><span data-ar="سجل المتابعة" data-en="Follow-up history">سجل المتابعة</span></a
          >
          <a class="back-cases" href="specialist-cases.html" data-ar="قائمة الحالات" data-en="Case list"
            ><svg

              <path d="M15 18l-6-6 6-6" /></svg

          ><button class="lang" id="langBtn">EN</button>

      </header>
      <main>
        <div class="wrap">
          <div class="legal">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"

            >
              <path d="M12 3 3 7v6c0 5 3.5 8 9 9 5.5-1 9-4 9-9V7l-9-4Z" />

            </svg>
            <span
              data-ar="هذه النتيجة أداة مساندة للقرار ولا تُعد تشخيصًا نهائيًا. القرار السريري النهائي مسؤولية المختص."
              data-en="This result supports clinical decision-making and is not a final diagnosis. The qualified specialist remains responsible for the final clinical decision."
              >هذه النتيجة أداة مساندة للقرار ولا تُعد تشخيصًا نهائيًا. القرار السريري النهائي مسؤولية المختص.</span
            >
          </div>

          <div class="legal" id="simBanner" style="display:none;background:#0f2350;border-color:#26407e;color:#dfe7ff">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" />
            </svg>
            <span
              data-ar="فرز أولي مولّد لأغراض عرض سير النظام. النتيجة والأولوية والمؤشرات محاكاة ثابتة ولا تعتمد على تحليل فعلي للصوت."
              data-en="Preliminary screening generated to demonstrate the system flow. The result, priority and indicators are a fixed simulation and are not based on real audio analysis."

            >
          </div>

          <div class="col" id="left"><!-- evidence sections --></div>

          <div class="col">
            <div class="card decision" id="decision"><!-- decision panel --></div>
          </div>
        </div>
      </main>
    </div>
    <div class="toast" id="toast"></div>
    <script>

        $$ = (s) => document.querySelectorAll(s);
      let lang = "ar",

        sentence_words: { ar: "طول الجملة", en: "Sentence length" },

      };
      const ANSWER_LABEL = {
        yes: { ar: "نعم", en: "Yes" },

        sometimes: { ar: "أحيانًا", en: "Sometimes" },
        often: { ar: "بشكل متكرر", en: "Often" },
        support: { ar: "بمساعدة جهاز أو أنبوب", en: "With device or tube support" },

        en: { ar: "الإنجليزية", en: "English" },
        both: { ar: "العربية والإنجليزية", en: "Arabic and English" },
        mother: { ar: "الأم", en: "Mother" },

        try {
          if (id) {
            ASSESS = await WASL_STORE.getAssessment(id);
            RESULT = await WASL_API.getResult(id);
          }
        } catch (e) {}
        if (!RESULT) {
          document.querySelector(".wrap").classList.add("is-empty");
          document.querySelector(".wrap").innerHTML = `
            <section class="card" style="grid-column:1/-1;text-align:center;padding:36px">

                  "أكمل التقييم والتحليل أولًا، ثم ارجع إلى قائمة الحالات.",

                )}

              <a class="approve" href="specialist-cases.html" style="display:inline-flex;text-decoration:none">
                ${text("العودة إلى قائمة الحالات", "Return to case list")}
              </a>
            </section>`;
          return;
        }
        ASSESS = ASSESS || { assessment_id: RESULT.assessment_id };
        try {
          RECS = await WASL_STORE.listRecordingsMeta(RESULT.assessment_id);
        } catch (e) {
          RECS = [];
        }
        decision.priority = RESULT.priority.level;
        decision.service = RESULT.recommended_service.code;
        if (ASSESS.red_flags && ASSESS.red_flags.level === "urgent") {
          decision.priority = "high";
          decision.in_person = true;
        }
        render();
        await mountAudio();
      }

          "Suggested specialist plan",

        // Independent model outputs for every recording. Scores are not diagnoses.
        const samples = RESULT.sample_results || [];
        const sampleBody = samples.length
          ? `<div class="model-samples">${samples
              .map((sample) => {
                const taskLabel = TASK_LABEL[sample.task] || { ar: sample.task, en: sample.task };
                const extraction = sample.feature_extraction || {};
                const extractionWarning =
                  extraction.clinical_voice_features === "fallback_zero" ||
                  (Array.isArray(extraction.warnings) && extraction.warnings.length > 0);
                const extractionStatus = `<div class="q-chips" style="margin:0 0 10px">
                  <span class="q-chip ${extractionWarning ? "bad" : "ok"}">
                    ${
                      extractionWarning
                        ? text("خصائص الصوت السريري تحتاج مراجعة", "Clinical voice features require review")
                        : text("استخراج 115 خاصية مكتمل", "115-feature extraction complete")
                    }
                  </span>
                  ${
                    extraction.trimmed_duration_seconds != null
                      ? `<span class="q-chip">${text("المدة المحللة", "Analyzed duration")}: ${extraction.trimmed_duration_seconds}s</span>`
                      : ""

                </div>`;
                const outputs = Object.entries(sample.results || {})
                  .map(([code, output]) => {
                    const condition = CONDITION_LABEL[code] || { ar: code, en: code };
                    const score = Math.round(Number(output.probability) * 1000) / 10;
                    const threshold = Math.round(Number(output.threshold) * 1000) / 10;
                    return `<div class="model-output">
                      <b data-ar="${condition.ar}" data-en="${condition.en}">${text(condition.ar, condition.en)}</b>
                      <span class="pill ${output.detected ? "warn" : "ok"}">${
                        output.detected ? text("تجاوز الحد", "Above threshold") : text("دون الحد", "Below threshold")
                      }</span>
                      <span class="model-number">${text("درجة النموذج", "Model score")}: ${score}% · ${text("الحد", "threshold")}: ${threshold}%</span>
                    </div>`;
                  })
                  .join("");
                return `<article class="model-sample">
                  <h3 data-ar="${taskLabel.ar}" data-en="${taskLabel.en}">${text(taskLabel.ar, taskLabel.en)}</h3>
                  ${extractionStatus}
                  ${outputs}
                </article>`;
              })

          : `<p style="color:var(--muted)">${text("لم تصل نتائج عينات تفصيلية.", "No per-sample results were returned.")}</p>`;

        const limitationsText = RESULT.limitations || {};

          : "";
        // Optional feature attribution, only when the provider returns it.
        const f = (RESULT.evidence && RESULT.evidence.speech_features) || {};
        const features = Object.keys(f).length ? sec(
          "6",
          "الخصائص الصوتية (للمختص فقط)",

      <div class="f"><b data-ar="مؤشر الطلاقة" data-en="Fluency index">مؤشر الطلاقة</b><span>${f.fluency_index ?? "-"}</span></div>
      <div class="f"><b data-ar="وضوح الإشارة الصوتية" data-en="Signal clarity">وضوح الإشارة الصوتية</b><span>${f.signal_clarity_db != null ? f.signal_clarity_db + " dB" : "-"}</span></div>
      <div class="f"><b data-ar="متوسط الصمت" data-en="Mean silence">متوسط الصمت</b><span>${f.mean_silence_pct != null ? f.mean_silence_pct + "%" : "-"}</span></div>
    </div>`,
        ) : "";
        // matched facilities
        const facs = RESULT.matched_facilities || [];
        const facBody = `<div class="fac">${facs
          .map(
            (fc) => `<div class="fc ${fc.rank === 1 ? "top" : ""}">

        const facilities = facs.length

        // audit

      async function mountAudio() {
        urls.forEach((u) => URL.revokeObjectURL(u));
        urls = [];
        const players = $$("#recList audio[data-task]");
        for (const el of players) {
          try {
            const u = await WASL_STORE.getRecordingURL(RESULT.assessment_id, el.dataset.task);
            if (u) {
              el.src = u;
              urls.push(u);
              const root = el.closest("[data-wave-task]");
              const task = el.dataset.task;
              const savedNotes =
                (ASSESS && ASSESS.clinical_audio_notes && ASSESS.clinical_audio_notes[task]) || [];
              await WASL_WAVEFORM.mount({
                root,
                audio: el,
                url: u,
                notes: savedNotes,
                labels: {
                  empty: text("لا توجد ملاحظات زمنية.", "No timestamped notes."),
                  unavailable: text("تعذّر عرض الموجة الصوتية لهذا الملف.", "Waveform unavailable for this file."),
                },
                onSave: async (notes) => {
                  const current = (await WASL_STORE.getAssessment(RESULT.assessment_id)) || ASSESS || {};
                  const noteMap = Object.assign({}, current.clinical_audio_notes || {});
                  noteMap[task] = notes;
                  await WASL_STORE.patchAssessment(RESULT.assessment_id, {
                    clinical_audio_notes: noteMap,
                  });
                  await WASL_STORE.appendAudit(RESULT.assessment_id, {
                    event: "timestamped_audio_note_added",
                    actor: "specialist",
                    task,
                    details: { note_count: notes.length },
                  });
                  ASSESS.clinical_audio_notes = noteMap;
                  toast(text("تم حفظ الملاحظة الزمنية", "Timestamped note saved"));
                },
              });
            }
          } catch (e) {}
        }
      }

      async function requestRetake() {
        const task = ($("#retakeTask") && $("#retakeTask").value) || "reading";

          await WASL_API.requestRetake(RESULT.assessment_id, task, "clarity");
          await WASL_STORE.appendAudit(RESULT.assessment_id, {
            event: "specialist_retake_requested",
            actor: "specialist",
            task,
            details: { reason: "clarity" },
          });
          toast(text("تم إرسال طلب إعادة التسجيل", "Retake request sent"));
        } catch (e) {
          toast(text("تعذّر إرسال الطلب", "Could not send request"));
        }
      }
      async function submitFinal() {
        const modified =
          decision.priority !== RESULT.priority.level || decision.service !== RESULT.recommended_service.code;
        // Gating: consent, explicit clinical selection and a clinical note.
        if (window._consentState !== "complete") {
          toast(
            text("لا يمكن الاعتماد قبل اكتمال موافقة ولي الأمر", "Cannot approve before guardian consent is complete"),
          );
          return;
        }
        if (!RESULT || RESULT.status !== "completed") {
          toast(text("نتيجة التحليل غير متوفرة بعد", "Analysis result is not available yet"));
          return;
        }
        if (!decision.priority || !decision.service) {
          toast(text("اختر مستوى الأولوية والمسار السريري", "Select a priority and clinical pathway"));
          return;
        }
        if (!(decision.notes && decision.notes.trim())) {
          toast(
            text("أدخل ملاحظة سريرية توضح أساس القرار", "Add a clinical note explaining the decision"),
          );
          return;
        }
        try {
          await WASL_API.submitClinicalReview(RESULT.assessment_id, {
            decision: "approved",
            priority: decision.priority,
            service: decision.service,
            notes: decision.notes,
            care_plan: decision.care_plan,
            in_person: decision.in_person,
            modified: modified,
            reviewer: "specialist_demo",
          });
          await WASL_STORE.appendAudit(RESULT.assessment_id, {
            event: "clinical_decision_approved",
            actor: "specialist",
            details: {
              priority: decision.priority,
              service: decision.service,
              modified,
            },
          });
          WASL_STORE.setResume({
            assessment_id: RESULT.assessment_id,
            url: "sehhaty.html",
            step: "approved_result",
            label_ar: "النتيجة المعتمدة في صحتي",
            label_en: "Approved result in Sehhaty",
          });
          const d = $("#decided");
          d.classList.add("show");
          d.textContent = text(
            "تم اعتماد القرار النهائي. أصبحت النتيجة جاهزة للعرض في صحتي.",
            "The final decision is approved. The result is ready to view in Sehhaty.",
          );
          const resultButton = document.createElement("button");
          resultButton.className = "primary";
          resultButton.type = "button";
          resultButton.textContent = text("عرض النتيجة المعتمدة في صحتي", "View the approved result in Sehhaty");
          resultButton.onclick = () => (location.href = "sehhaty.html");
          d.appendChild(resultButton);
          toast(text("تم اعتماد القرار النهائي", "Final decision approved"));
        } catch (e) {
          toast(text("تعذّر حفظ القرار", "Could not save decision"));
        }
      }

      window.setLang = function (n) {
        lang = n;
        document.documentElement.lang = n;
        document.documentElement.dir = n === "ar" ? "rtl" : "ltr";
        const lb = $("#langBtn");
        if (lb) lb.textContent = n === "ar" ? "EN" : "ع";
        render();
        mountAudio();
      };
      $("#langBtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");
      function toast(m) {
        const x = $("#toast");
        x.textContent = m;
        x.classList.add("show");
        setTimeout(() => x.classList.remove("show"), 2400);
      }
      load();
    </script>
  </body>
</html>
