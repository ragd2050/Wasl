<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مهام النطق والصوت | وصل</title>
    <link rel="stylesheet" href="assets/wasl-fonts.css" />
    <link rel="stylesheet" href="assets/wasl-enhance.css" />
    <style>
      :root {
        --navy: #112d72;
        --violet: #5754e9;
        --blue: #1597ed;
        --cyan: #08d8d2;
        --bg: #f4f7fc;
        --muted: #6f7b90;
        --line: #dfe6f1;
        --soft: #f7f9fd;
        --green: #16865b;
        --red: #df4c60;
        --shadow: 0 20px 55px rgba(17, 45, 114, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Tajawal", sans-serif;
        color: #17213b;
        background: var(--bg);
      }
      body {
        overflow: hidden;
      }
      .app {
        height: 100dvh;
        display: grid;
        grid-template-rows: 68px 1fr;
        background: radial-gradient(circle at 4% 92%, rgba(8, 216, 210, 0.12), transparent 25%), var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(24px, 5vw, 70px);
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        width: 126px;
        height: 48px;
        object-fit: contain;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .secure {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--green);
        font-size: 0.8rem;
      }
      .secure i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
      }
      .lang {
        height: 39px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--navy);
        font-weight: 800;
        cursor: pointer;
      }
      main {
        min-height: 0;
        padding: 20px clamp(22px, 5vw, 76px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .shell {
        width: min(1120px, 100%);
        height: min(690px, calc(100dvh - 108px));
        min-height: 575px;
        padding: 28px clamp(30px, 5vw, 58px);
        border: 1px solid var(--line);
        border-radius: 25px;
        background: #fff;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
      }
      .top {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 28px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--line);
      }
      .title small {
        display: block;
        color: var(--violet);
        font-size: 0.8rem;
        font-weight: 800;
      }
      .title h1 {
        margin: 5px 0 0;
        color: var(--navy);
        font-size: clamp(1.5rem, 2.3vw, 2rem);
      }
      .progress {
        width: min(420px, 45%);
      }
      .progress-label {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 0.76rem;
      }
      .track {
        height: 7px;
        border-radius: 99px;
        background: #edf1f7;
        overflow: hidden;
      }
      .bar {
        height: 100%;
        width: 20%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--violet));
        transition: 0.25s;
      }
      .work {
        flex: 1;
        min-height: 0;
        padding: 22px 0 12px;
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
        gap: 26px;
        align-items: center;
      }
      .stimulus {
        height: 100%;
        min-height: 340px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 19px;
        background: var(--soft);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .instruction {
        color: var(--violet);
        font-size: 0.77rem;
        font-weight: 800;
      }
      .prompt {
        margin: 9px 0 15px;
        color: var(--navy);
        font-size: clamp(1.15rem, 2vw, 1.55rem);
        line-height: 1.45;
      }
      .hint {
        margin: -7px 0 14px;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .visual-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .picture {
        min-height: 100px;
        border: 1.5px solid var(--line);
        border-radius: 15px;
        background: #fff;
        font-size: 2.8rem;
        cursor: pointer;
        transition: 0.15s;
      }
      .picture:hover {
        border-color: #86a7e8;
        transform: translateY(-2px);
      }
      .picture.correct {
        border-color: var(--green);
        background: #eaf8f1;
      }
      .picture.wrong {
        border-color: var(--red);
        background: #fff1f3;
      }
      .single-picture {
        height: 190px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: #fff;
        font-size: 6rem;
      }
      .scene {
        min-height: 210px;
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: linear-gradient(#dff3ff 0 60%, #dff3d5 60%);
        font-size: 4.5rem;
      }
      .story {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 9px;
      }
      .story-card {
        min-height: 150px;
        padding: 13px 8px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
      }
      .story-card b {
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e9edff;
        color: var(--violet);
        font-size: 0.75rem;
      }
      .story-card span {
        font-size: 3rem;
        margin-top: 12px;
      }
      .passage {
        padding: 23px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: #fff;
        color: var(--navy);
        font-size: 1.05rem;
        line-height: 2;
      }
      .recorder {
        text-align: center;
      }
      .mic {
        width: 118px;
        height: 118px;
        margin: 0 auto 16px;
        border: 0;
        border-radius: 50%;
        background: linear-gradient(145deg, var(--cyan), var(--violet));
        color: #fff;
        font-size: 2.35rem;
        cursor: pointer;
        box-shadow: 0 15px 35px rgba(87, 84, 233, 0.24);
      }
      .mic.recording {
        background: var(--red);
        animation: pulse 1.4s infinite;
      }
      .mic.done {
        background: var(--green);
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 15px rgba(223, 76, 96, 0.12);
        }
      }
      .status {
        color: var(--navy);
        font-weight: 800;
      }
      .timer {
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .playback {
        display: none;
        width: 100%;
        margin-top: 12px;
      }
      .playback.show {
        display: block;
      }
      .message {
        min-height: 20px;
        margin-top: 7px;
        color: var(--red);
        font-size: 0.76rem;
        font-weight: 700;
      }
      .selection-status {
        padding: 17px;
        border-radius: 14px;
        background: #eef3fc;
        color: var(--navy);
        font-size: 0.82rem;
        line-height: 1.6;
      }
      .selection-status strong {
        display: block;
        font-size: 1rem;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: auto;
      }
      .nav {
        display: flex;
        gap: 9px;
      }
      .primary,
      .secondary {
        height: 47px;
        padding: 0 23px;
        border-radius: 12px;
        font:
          700 0.88rem "Tajawal",
          sans-serif;
        cursor: pointer;
      }
      .primary {
        min-width: 170px;
        border: 0;
        color: #fff;
        background: linear-gradient(105deg, var(--navy), var(--violet));
        box-shadow: 0 9px 20px rgba(87, 84, 233, 0.18);
      }
      .primary:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }
      .secondary {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--navy);
      }
      .secondary:disabled {
        opacity: 0.35;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translate(-50%, 20px);
        opacity: 0;
        padding: 11px 17px;
        border-radius: 11px;
        background: #17213b;
        color: #fff;
        font-size: 0.8rem;
        transition: 0.2s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 820px) {
        body {
          overflow: auto;
        }
        .app {
          height: auto;
          min-height: 100dvh;
        }
        .secure {
          display: none;
        }
        main {
          padding: 14px;
        }
        .shell {
          height: auto;
          min-height: calc(100dvh - 96px);
          padding: 24px 19px;
        }
        .top {
          flex-direction: column;
          align-items: stretch;
        }
        .progress {
          width: 100%;
        }
        .work {
          grid-template-columns: 1fr;
          gap: 18px;
        }
        .stimulus {
          min-height: 330px;
        }
        .visual-grid {
          grid-template-columns: 1fr 1fr;
        }
        .story {
          grid-template-columns: 1fr 1fr;
        }
        .recorder {
          padding-bottom: 8px;
        }
        .actions {
          align-items: stretch;
          flex-direction: column-reverse;
          gap: 10px;
        }
        .nav {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }
        .primary,
        .secondary {
          width: 100%;
          min-width: 0;
        }
        .logo {
          width: 104px;
        }
      }

      .picture {
        height: 124px;
        padding: 0;
        overflow: hidden;
        font-size: 0;
      }
      .picture img,
      .single-picture img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .single-picture {
        display: block;
        overflow: hidden;
        font-size: 0;
      }
      .scene,
      .story {
        height: 230px;
        min-height: 230px;
        padding: 0;
        display: block;
        overflow: hidden;
        background: #fff;
      }
      .scene img,
      .story img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .recorder:empty {
        display: none;
      }
      .work:has(.recorder:empty) {
        grid-template-columns: 1fr;
      }
      .work:has(.recorder:empty) .stimulus {
        width: min(820px, 100%);
        justify-self: center;
      }

      .timer {
        direction: ltr;
        unicode-bidi: isolate;
      }
      [dir="rtl"] .story img {
        transform: scaleX(-1);
      }
    </style>
    <style>
      .rec-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
      }
      .mic.processing,
      .mic.checking {
        background: linear-gradient(145deg, #f0a63a, #e2762f);
        animation: none;
        cursor: default;
      }
      .mic.error {
        background: linear-gradient(145deg, #e0655f, #c23b4c);
      }
      .mic:disabled {
        cursor: default;
        opacity: 0.9;
      }
      .rec-state {
        margin-top: 2px;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.2px;
        padding: 5px 12px;
        border-radius: 999px;
        background: #eef3fc;
        color: var(--navy);
      }
      .rec-state.good {
        background: #e8f7ef;
        color: #136c4c;
      }
      .rec-state.warn {
        background: #fff2e6;
        color: #a55b12;
      }
      .rec-state.bad {
        background: #fdeef0;
        color: #b23046;
      }
      .rec-state.busy {
        background: #eef1ff;
        color: #4b46c7;
      }
      .quality-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 2px;
      }
      .q-chip {
        font-size: 0.68rem;
        font-weight: 700;
        padding: 4px 9px;
        border-radius: 8px;
        background: #f2f5fa;
        color: #5a6b82;
        border: 1px solid var(--line);
      }
      .q-chip.ok {
        background: #e8f7ef;
        color: #136c4c;
        border-color: #bfe6d2;
      }
      .q-chip.bad {
        background: #fdeef0;
        color: #b23046;
        border-color: #f2cdd4;
      }
      .quality-guidance {
        max-width: 330px;
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.65;
        text-align: center;
      }
      .task-plan {
        margin: 0 0 14px;
        padding: 10px 14px;
        border: 1px solid #dce5f5;
        border-radius: 12px;
        color: #52627a;
        background: #f7f9fd;
        font-size: 0.76rem;
        line-height: 1.6;
      }
      .practice-overlay {
        position: fixed;
        inset: 0;
        z-index: 90;
        display: none;
        place-items: center;
        padding: 18px;
        background: rgba(12, 31, 73, 0.68);
      }
      .practice-overlay.show {
        display: grid;
      }
      .practice-card {
        width: min(520px, 100%);
        padding: 26px;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 28px 80px rgba(12, 31, 73, 0.28);
        text-align: center;
      }
      .practice-card h2 {
        margin: 0 0 8px;
        color: var(--navy);
      }
      .practice-card p {
        color: var(--muted);
        line-height: 1.7;
      }
      .practice-options {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 18px 0 12px;
      }
      .practice-options button {
        min-height: 150px;
        padding: 10px;
        border: 2px solid var(--line);
        border-radius: 16px;
        background: #fff;
        cursor: pointer;
      }
      .practice-options img {
        width: 100%;
        height: 125px;
        object-fit: contain;
      }
      .practice-result {
        min-height: 28px;
        color: var(--violet);
        font-weight: 800;
      }
      .practice-start {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        color: #fff;
        background: linear-gradient(105deg, var(--navy), var(--violet));
        font: 800 0.9rem "Tajawal";
        cursor: pointer;
      }
      .practice-start:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .rec-actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .rec-actions button {
        height: 40px;
        padding: 0 14px;
        border-radius: 11px;
        font:
          700 0.8rem "Tajawal",
          sans-serif;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--navy);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .rec-actions button svg {
        width: 16px;
        height: 16px;
      }
      .rec-actions .danger {
        color: #b23046;
        border-color: #f2cdd4;
      }
      .upload-line {
        font-size: 0.72rem;
        color: var(--muted);
        min-height: 16px;
      }
      .upload-line.ok {
        color: #136c4c;
      }
      .upload-line.bad {
        color: #b23046;
      }
      .mic-help {
        margin-top: 8px;
        text-align: center;
        max-width: 320px;
      }
      .mic-help p {
        margin: 0 0 10px;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .mic-help .perm {
        height: 44px;
        padding: 0 18px;
        border-radius: 12px;
        border: 0;
        background: linear-gradient(105deg, var(--navy), var(--violet));
        color: #fff;
        font:
          800 0.85rem "Tajawal",
          sans-serif;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .mic-help .perm svg {
        width: 17px;
        height: 17px;
      }
      .demo-flag {
        position: fixed;
        inset-block-start: 0;
        inset-inline: 0;
        text-align: center;
        background: #132a63;
        color: #dfe7ff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 3px;
        z-index: 20;
        letter-spacing: 0.3px;
      }
      @media (max-width: 820px) {
        .demo-flag {
          font-size: 0.62rem;
        }
      }
    </style>
    <script src="assets/wasl-store.js"></script>
    <script src="assets/wasl-api.js"></script>
    <script defer src="assets/wasl-enhance.js"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <img class="logo" src="assets/wasl-logo-1.webp" alt="منصة وصل" />
        <div class="tools"><button class="lang" id="langBtn">EN</button></div>
      </header>
      <main>
        <section class="shell">
          <div class="top">
            <div class="title">
              <small id="sectionLabel">مهام النطق والصوت</small>
              <button class="wasl-speak" data-speak="#pageTitle" type="button" aria-label="استماع">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M11 5 6 9H3v6h3l5 4V5Z" />
                  <path d="M16 9a3 3 0 0 1 0 6M18.5 6.5a7 7 0 0 1 0 11" />
                </svg>
              </button>
              <h1 id="pageTitle" data-speak-auto></h1>
            </div>
            <div class="progress">
              <div class="progress-label"><span id="count"></span><span id="pct"></span></div>
              <div class="track"><div class="bar" id="bar"></div></div>
            </div>
          </div>
          <div class="work">
            <section class="stimulus" id="stimulus"></section>
            <aside class="recorder" id="recorder"></aside>
          </div>
          <div class="actions">
            <button class="secondary" id="exitBtn">حفظ والخروج مؤقتًا</button>
            <div class="nav">
              <button class="secondary" id="prevBtn">رجوع</button
              ><button class="primary" id="nextBtn" disabled>متابعة</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="practice-overlay" id="practiceOverlay" role="dialog" aria-modal="true" aria-labelledby="practiceTitle">
      <section class="practice-card">
        <h2 id="practiceTitle" data-ar="تجربة قصيرة قبل البدء" data-en="A short practice before starting">تجربة قصيرة قبل البدء</h2>
        <p data-ar="هذه المحاولة للتدريب فقط ولا تدخل في النتيجة. أشِر إلى الكرة." data-en="This practice is not scored. Point to the ball.">
          هذه المحاولة للتدريب فقط ولا تدخل في النتيجة. أشِر إلى الكرة.
        </p>
        <div class="practice-options">
          <button type="button" data-practice-choice="cat" aria-label="قطة">
            <img src="assets/assessment/cat.webp" alt="قطة" />
          </button>
          <button type="button" data-practice-choice="ball" aria-label="كرة">
            <img src="assets/assessment/ball.webp" alt="كرة" />
          </button>
        </div>
        <div class="practice-result" id="practiceResult" role="status"></div>
        <button class="practice-start" id="practiceStart" type="button" disabled data-ar="ابدأ المهام" data-en="Start tasks">ابدأ المهام</button>
      </section>
    </div>
    <div class="toast" id="toast"></div>
    <script>
      /* ---- Speech & Voice tasks — MediaRecorder, quality validation and IndexedDB ---- */
      const ASSESS_ID = WASL_STORE.ensureAssessmentId("audio");
      const $ = (s) => document.querySelector(s),
        $$ = (s) => document.querySelectorAll(s);
      let lang = "ar",
        index = 0,
        trial = 0;
      let mediaRecorder = null,
        stream = null,
        chunks = [],
        timerId = null,
        seconds = 0,
        curURL = null;
      const MIN_SEC = 1.2,
        MAX_SEC = 60;

      /* task list — 'point' is selection (no audio); the rest are voice recordings */
      let tasks = [
        {
          type: "point",
          key: "pointing",
          minSec: 0,
          title: { ar: "أشِر إلى الشيء المطلوب", en: "Point to the named item" },
        },
        {
          type: "name",
          key: "picture_naming",
          minSec: 3,
          title: { ar: "تسمية الصور", en: "Name the pictures" },
        },
        {
          type: "describe",
          key: "picture_description",
          minSec: 5,
          title: { ar: "وصف صورة", en: "Describe a picture" },
        },
        {
          type: "story",
          key: "story_narration",
          minSec: 6,
          title: { ar: "سرد أحداث قصة", en: "Tell the story" },
        },
        {
          type: "read",
          key: "reading",
          minSec: 8,
          title: { ar: "قراءة نص مناسب للعمر", en: "Read an age-appropriate text" },
        },
      ];
      const conversationTask = {
        type: "conversation",
        key: "connected_speech",

      };
      let taskPlan = { profile: "standard", reason_ar: "خطة مناسبة للعمر", reason_en: "Age-appropriate task plan" };
      const trials = [
        {
          ask: { ar: "أشِر إلى التفاحة الحمراء", en: "Point to the red apple" },
          items: ["apple", "banana", "car", "cat"],
          alts: [

            ["كتاب", "book"],
            ["كرة", "ball"],

          ],

        },
      ];
      const state = {}; // per index: {status, quality}
      const completed = {}; // per index: boolean
      const pointTrials = []; // saved pointing attempts: {prompt, choice, correct, response_ms}
      let trialStart = 0;

      function text(ar, en) {
        return lang === "ar" ? ar : en;
      }
      const photo = (name, altAr, altEn) => `<img src="assets/assessment/${name}.webp" alt="${text(altAr, altEn)}">`;

      /* optional controlled-test override: ?forcequality=ok|short|low|noise|clipped */
      const FORCE_Q = (new URLSearchParams(location.search).get("forcequality") || "").toLowerCase();

      /* ---------- audio quality validation (client-side pre-check) ---------- */
      async function computeQuality(blob, fallbackDur) {
        if (FORCE_Q) {
          const map = {
            ok: { status: "ok", noise_level: "low", volume_level: "acceptable" },
            short: { status: "short", noise_level: "low", volume_level: "acceptable" },
            low: { status: "low", noise_level: "low", volume_level: "low" },
            noise: { status: "noise", noise_level: "high", volume_level: "acceptable" },
            clipped: { status: "clipped", noise_level: "low", volume_level: "high", clipping_pct: 4.2 },
          };
          return Object.assign(
            {
              duration_sec: fallbackDur || 2,
              rms_db: -20,
              noise_floor_db: -42,
              snr_db: 22,
              clipping_pct: 0,
              silence_pct: 12,
            },
            map[FORCE_Q] || map.ok,
          );
        }
        try {
          const buf = await blob.arrayBuffer();
          const AC = window.AudioContext || window.webkitAudioContext;
          const ctx = new AC();
          const audio = await ctx.decodeAudioData(buf.slice(0));
          const dur = audio.duration;
          const data = audio.getChannelData(0);
          // Frame-level signal measurements. These validate capture quality only;
          // they do not diagnose a speech or language condition.
          const F = 1024;
          let frames = [],
            sumSq = 0,
            clipped = 0;
          for (let i = 0; i < data.length; i += F) {
            let s = 0,
              n = 0;
            for (let j = i; j < i + F && j < data.length; j++) {
              s += data[j] * data[j];
              n++;
            }
            const rms = Math.sqrt(s / (n || 1));
            frames.push(rms);
            sumSq += s;
          }
          for (let i = 0; i < data.length; i++) {
            if (Math.abs(data[i]) >= 0.98) clipped++;
          }
          const overall = Math.sqrt(sumSq / (data.length || 1));
          frames.sort((a, b) => a - b);
          const lowCount = Math.max(1, Math.floor(frames.length * 0.2));
          const highCount = Math.max(1, Math.floor(frames.length * 0.3));
          const floor = frames.slice(0, lowCount).reduce((a, b) => a + b, 0) / lowCount;
          const active = frames.slice(-highCount).reduce((a, b) => a + b, 0) / highCount;
          const silenceThreshold = Math.max(0.008, floor * 1.8);
          const silentFrames = frames.filter((value) => value < silenceThreshold).length;
          const silencePct = (silentFrames / Math.max(1, frames.length)) * 100;
          const clippingPct = (clipped / Math.max(1, data.length)) * 100;
          const snrDb = 20 * Math.log10(Math.max(active, 0.000001) / Math.max(floor, 0.000001));
          const toDb = (value) => 20 * Math.log10(Math.max(value, 0.000001));
          ctx.close && ctx.close();
          let volume_level = overall < 0.012 ? "low" : overall > 0.35 ? "high" : "acceptable";
          let noise_level = snrDb < 6 || floor > 0.04 ? "high" : snrDb < 12 ? "moderate" : "low";
          let status = "ok";
          const requiredDuration = (tasks[index] && tasks[index].minSec) || MIN_SEC;
          if (dur < requiredDuration) status = "short";
          else if (volume_level === "low") status = "low";
          else if (clippingPct > 2) status = "clipped";
          else if (noise_level === "high") status = "noise";
          return {
            status,
            noise_level,
            volume_level,
            duration_sec: Math.round(dur * 10) / 10,
            rms_db: Math.round(toDb(overall) * 10) / 10,
            noise_floor_db: Math.round(toDb(floor) * 10) / 10,
            snr_db: Math.round(snrDb * 10) / 10,
            clipping_pct: Math.round(clippingPct * 100) / 100,
            silence_pct: Math.round(silencePct),
            sample_rate: audio.sampleRate,
          };
        } catch (e) {
          // decode unsupported -> accept using timer duration (documented fallback)
          const dur = fallbackDur || 0;
          return {
            status: dur < ((tasks[index] && tasks[index].minSec) || MIN_SEC) ? "short" : "ok",
            noise_level: "low",
            volume_level: "acceptable",
            duration_sec: dur,
          };
        }
      }

      function writeAscii(view, offset, value) {
        for (let i = 0; i < value.length; i++) {
          view.setUint8(offset + i, value.charCodeAt(i));
        }
      }

      async function convertRecordingToWav(blob) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const context = new AudioContextClass();

        try {
          const input = await blob.arrayBuffer();
          const decoded = await context.decodeAudioData(input.slice(0));
          const frameCount = decoded.length;
          const sampleRate = decoded.sampleRate;
          const mono = new Float32Array(frameCount);

          for (let channelIndex = 0; channelIndex < decoded.numberOfChannels; channelIndex++) {
            const channel = decoded.getChannelData(channelIndex);

            for (let frame = 0; frame < frameCount; frame++) {
              mono[frame] += channel[frame] / decoded.numberOfChannels;
            }
          }

          const dataBytes = frameCount * 2;
          const buffer = new ArrayBuffer(44 + dataBytes);
          const view = new DataView(buffer);

          writeAscii(view, 0, "RIFF");
          view.setUint32(4, 36 + dataBytes, true);
          writeAscii(view, 8, "WAVE");
          writeAscii(view, 12, "fmt ");
          view.setUint32(16, 16, true);
          view.setUint16(20, 1, true);
          view.setUint16(22, 1, true);
          view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate * 2, true);
          view.setUint16(32, 2, true);
          view.setUint16(34, 16, true);
          writeAscii(view, 36, "data");
          view.setUint32(40, dataBytes, true);

          for (let frame = 0; frame < frameCount; frame++) {
            const sample = Math.max(-1, Math.min(1, mono[frame]));
            const value = sample < 0 ? sample * 32768 : sample * 32767;
            view.setInt16(44 + frame * 2, value, true);
          }

          return new Blob([buffer], { type: "audio/wav" });
        } finally {
          if (context.close) {
            await context.close();
          }
        }
      }

      /* ---------- stimulus rendering (real images) ---------- */
      function stimulusHTML(t) {
        if (t.type === "point") {
          const x = trials[trial];
          return `<span class="instruction">${text(`المحاولة ${trial + 1} من 3`, `Trial ${trial + 1} of 3`)}</span>
      <h2 class="prompt">${x.ask[lang]}</h2>
      <p class="hint">${text("اطلب من الطفل الإشارة إلى الصورة الصحيحة.", "Ask the child to point to the correct picture.")}</p>

        }
        if (t.type === "name")
          return `<span class="instruction">${text("مهمة نطق", "Speaking task")}</span>
      <h2 class="prompt">${text("سمِّ الصور التالية بالترتيب.", "Name the following pictures in order.")}</h2>

      <h2 class="prompt">${text("صِف ما يحدث في الصورة بجمل واضحة.", "Describe what is happening in the picture.")}</h2>
      <div class="scene">${photo("park-scene", "طفلة تلعب بالكرة مع كلب في الحديقة", "a child playing ball with a dog in the park")}</div>`;

        if (t.type === "conversation")
          return `<span class="instruction">${text("مهمة كلام تلقائي", "Spontaneous speech task")}</span>
      <h2 class="prompt">${text("حدّثنا عن لعبتك المفضلة وماذا تحب أن تفعل بها.", "Tell us about your favorite toy and what you like to do with it.")}</h2>
      <p class="hint">${text("اترك للطفل وقتًا كافيًا، ولا تصحح كلامه أثناء التسجيل.", "Give the child enough time and do not correct their speech during recording.")}</p>`;
        return `<span class="instruction">${text("مهمة قراءة", "Reading task")}</span>
      <h2 class="prompt">${text("اقرأ النص التالي بصوت واضح.", "Read the following text clearly.")}</h2>
      <p class="passage">${text(
        "ذهبت سارة مع أسرتها إلى الحديقة في صباحٍ جميل. شاهدت الطيور وهي تطير، ثم لعبت بالكرة مع أختها وعادت إلى المنزل سعيدة.",
        "Sara went to the park with her family on a beautiful morning. She watched the birds fly, then played ball with her sister and returned home happy.",
      )}</p>`;
      }

      /* ---------- recorder panel per state ---------- */
      const STATE_LABEL = {
        idle: { ar: "اضغط لبدء التسجيل", en: "Tap to start recording", cls: "" },
        permission: { ar: "يلزم إذن الميكروفون", en: "Microphone permission required", cls: "busy" },
        recording: { ar: "جارٍ التسجيل… اضغط للإيقاف", en: "Recording… tap to stop", cls: "busy" },
        processing: { ar: "جارٍ معالجة التسجيل", en: "Processing recording", cls: "busy" },
        checking: { ar: "جارٍ فحص جودة الصوت", en: "Checking audio quality", cls: "busy" },
        saved: { ar: "تم حفظ التسجيل", en: "Recording saved", cls: "good" },
        short: { ar: "التسجيل قصير جدًا — أعد المحاولة", en: "Recording too short — retry", cls: "bad" },
        low: { ar: "مستوى الصوت منخفض — اقترب وأعد المحاولة", en: "Low volume detected — retry closer", cls: "warn" },
        noise: { ar: "ضوضاء خلفية عالية — سجّل في مكان أهدأ", en: "Excessive background noise — retry", cls: "warn" },
        clipped: { ar: "الصوت مرتفع جدًا — أبعد الجهاز قليلًا", en: "Audio is clipping — move the device slightly away", cls: "warn" },
        nomic: { ar: "يلزم السماح باستخدام الميكروفون", en: "Microphone permission required", cls: "bad" },
        uploadfail: { ar: "تعذّر رفع التسجيل — أعد المحاولة", en: "Upload failed — retry", cls: "bad" },
      };
      function recorderHTML(t) {
        if (t.type === "point") {
          return `<div class="selection-status"><strong>${text("مهمة إشارة", "Pointing task")}</strong>${text("اطلب من الطفل الإشارة إلى الصورة المطلوبة في كل محاولة.", "Ask the child to point to the requested picture in each trial.")}</div>`;
        }
        const st = (state[index] && state[index].status) || "idle";
        const done = st === "saved";
        const err = ["short", "low", "noise", "clipped", "nomic", "uploadfail"].indexOf(st) > -1;
        const busy = ["permission", "recording", "processing", "checking"].indexOf(st) > -1;
        const lab = STATE_LABEL[st] || STATE_LABEL.idle;
        const micCls =
          st === "recording"
            ? "recording"
            : st === "processing" || st === "checking"
              ? "processing"
              : done
                ? "done"
                : err
                  ? "error"
                  : "";
        const micGlyph = st === "recording" ? "■" : done ? "✓" : err ? "↻" : "●";
        const q = state[index] && state[index].quality;
        let qrow = "";
        if (q) {
          const chip = (okAr, okEn, bad) => `<span class="q-chip ${bad ? "bad" : "ok"}">${text(okAr, okEn)}</span>`;
          const requiredDuration = (tasks[index] && tasks[index].minSec) || MIN_SEC;
          qrow = `<div class="quality-row">
      ${chip("الصوت: " + (q.volume_level === "low" ? "منخفض" : "مقبول"), "Volume: " + (q.volume_level === "low" ? "low" : "ok"), q.volume_level === "low")}
      ${chip("الضوضاء: " + (q.noise_level === "high" ? "عالية" : q.noise_level === "moderate" ? "متوسطة" : "منخفضة"), "Noise: " + q.noise_level, q.noise_level === "high")}
      ${chip("المدة: " + (q.duration_sec || 0) + "s", "Length: " + (q.duration_sec || 0) + "s", (q.duration_sec || 0) < requiredDuration)}
    </div>
    <p class="quality-guidance">${qualityGuidance(q)}</p>`;
        }
        return `<div class="rec-panel">
    <button class="mic ${micCls}" id="micBtn" ${busy && st !== "recording" ? "disabled" : ""} aria-label="${lab[lang]}">${micGlyph}</button>
    <div class="rec-state ${lab.cls}" id="recState">${lab[lang]}</div>
    <div class="timer" id="timer">00:00 / 01:00</div>
    ${qrow}
    <audio class="playback ${done ? "show" : ""}" id="playback" controls></audio>
    ${
      st === "nomic"
        ? `<div class="mic-help" id="micHelp">
            <p>
              ${text(
                "لم يُسمح باستخدام الميكروفون. افتح إعدادات الإذن في المتصفح واسمح بالوصول، ثم أعد المحاولة.",
                "Microphone access was blocked. Allow access in your browser permission settings, then try again.",
              )}
            </p>
            <button id="permBtn" type="button" class="perm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1v11"/>
                <path d="M8 5a4 4 0 0 1 8 0v6a4 4 0 0 1-8 0"/>
                <path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>
              </svg>
              ${text("إعادة طلب الإذن", "Re-request permission")}
            </button>
          </div>`
        : ""
    }
    <div class="rec-actions" id="recActions" style="${(done || err) && st !== "nomic" ? "" : "display:none"}">
      <button id="againBtn" class="danger" type="button">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        ${text("حذف وإعادة التسجيل", "Delete & re-record")}
      </button>
    </div>
    <div class="upload-line" id="uploadLine"></div>
  </div>`;
      }

      function qualityGuidance(q) {
        const messages = {
          short: text(
            "التسجيل أقصر من المطلوب لهذه المهمة. اترك للطفل وقتًا أطول للإجابة.",
            "This sample is shorter than required. Give the child more time to respond.",
          ),
          low: text(
            "قرّب الجهاز من الطفل وتأكد من عدم تغطية الميكروفون.",
            "Move the device closer and make sure the microphone is not covered.",
          ),
          noise: text(
            "انتقل إلى مكان أهدأ وأوقف مصادر الصوت القريبة.",
            "Move to a quieter place and reduce nearby sounds.",
          ),
          clipped: text(
            "أبعد الجهاز قليلًا عن الطفل لتجنب تشوّه الصوت.",
            "Move the device slightly away to prevent distorted audio.",
          ),
          ok: text("جودة التسجيل مناسبة للمتابعة.", "Recording quality is suitable to continue."),
        };
        return messages[q.status] || messages.ok;
      }

      async function refreshPlayback() {
        const pb = $("#playback");
        if (!pb) return;
        if (state[index] && state[index].status === "saved") {
          if (curURL) {
            URL.revokeObjectURL(curURL);
            curURL = null;
          }
          const url = await WASL_STORE.getRecordingURL(ASSESS_ID, tasks[index].key);
          if (url) {
            curURL = url;
            pb.src = url;
          }
        }
      }

      function render() {
        const t = tasks[index],
          n = index + 1,
          p = Math.round((n / tasks.length) * 100);
        $("#pageTitle").textContent = t.title[lang];
        $("#count").textContent = text(`المهمة ${n} من ${tasks.length}`, `Task ${n} of ${tasks.length}`);
        $("#pct").textContent = p + "%";
        $("#bar").style.width = p + "%";
        $("#stimulus").innerHTML =
          (index === 0
            ? `<p class="task-plan">${text(
                "تم إعداد هذه المهام بما يناسب عمر الطفل وإجابات ولي الأمر.",
                "These tasks were selected for the child's age and guardian responses.",
              )}</p>`
            : "") + stimulusHTML(t);
        $("#recorder").innerHTML = recorderHTML(t);
        $("#prevBtn").disabled = index === 0;
        $("#nextBtn").textContent =
          index === tasks.length - 1 ? text("إنهاء المهام", "Finish tasks") : text("متابعة", "Continue");
        $("#nextBtn").disabled = !completed[index];
        setLabels();
        if (t.type === "point") {
          trialStart = performance.now();
          $$("[data-choice]").forEach((b) => (b.onclick = () => choose(+b.dataset.choice)));
        } else {
          const mic = $("#micBtn");
          if (mic) mic.onclick = onMic;
          const again = $("#againBtn");
          if (again) again.onclick = reRecord;
          const perm = $("#permBtn");
          if (perm) perm.onclick = () => startRecording();
          refreshPlayback();
        }
        document.title = text("مهام النطق والصوت | وصل", "Speech & voice tasks | WASL");
        if (window.waslWireSpeakers) window.waslWireSpeakers();
      }
      function setLabels() {
        $("#sectionLabel").textContent = text("مهام النطق والصوت", "Speech & voice tasks");
        $("#exitBtn").textContent = text("حفظ والخروج مؤقتًا", "Save and exit");
        $("#prevBtn").textContent = text("رجوع", "Back");
      }

      /* ----- pointing task ----- */
      function choose(choice) {
        $$("[data-choice]").forEach((b) => (b.disabled = true));
        const t = trials[trial];
        const isCorrect = choice === t.answer;
        const responseMs = Math.round(performance.now() - trialStart);
        pointTrials.push({
          prompt: t.ask.en,
          prompt_ar: t.ask.ar,
          choice_index: choice,
          choice_item: t.items[choice],
          correct: isCorrect,
          response_ms: responseMs,
        });
        const picked = $(`[data-choice="${choice}"]`);
        picked.style.borderColor = "var(--blue)";
        picked.style.background = "#eef6ff";
        setTimeout(() => {
          if (trial < 2) {
            trial++;
            render();
          } else {
            completed[0] = true;
            $("#nextBtn").disabled = false;
            WASL_STORE.patchAssessment(ASSESS_ID, { pointing_trials: pointTrials.slice() });
            WASL_STORE.appendAudit(ASSESS_ID, {
              event: "pointing_task_completed",
              actor: "guardian_child_session",
              task: "pointing",
              details: { attempts: pointTrials.length },
            });
            toast(text("اكتملت محاولات الإشارة", "Pointing trials completed"));
          }
        }, 450);
      }

      /* ----- recording ----- */
      function setState(s) {
        state[index] = state[index] || {};
        state[index].status = s;
        render();
      }
      function onMic() {
        mediaRecorder && mediaRecorder.state === "recording" ? stopRecording() : startRecording();
      }

      async function startRecording() {
        setState("permission");
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch (e) {
          setState("nomic");
          return;
        }
        chunks = [];
        seconds = 0;
        try {
          mediaRecorder = new MediaRecorder(stream);
        } catch (e) {
          mediaRecorder = new MediaRecorder(stream, {});
        }
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size) chunks.push(e.data);
        };
        mediaRecorder.onstop = onStopped;
        mediaRecorder.start();
        setState("recording");
        const tm = $("#timer");
        if (tm) tm.textContent = "00:00 / 01:00";
        timerId = setInterval(() => {
          seconds++;
          const el = $("#timer");
          if (el) el.textContent = `00:${String(seconds).padStart(2, "0")} / 01:00`;
          if (seconds >= MAX_SEC) stopRecording();
        }, 1000);
      }
      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
      }

      async function onStopped() {
        clearInterval(timerId);
        const dur = seconds;
        if (stream) {
          stream.getTracks().forEach((t) => t.stop());
          stream = null;
        }
        setState("processing");
        const blob = new Blob(chunks, { type: (mediaRecorder && mediaRecorder.mimeType) || "audio/webm" });
        setState("checking");
        const q = await computeQuality(blob, dur);
        state[index] = state[index] || {};
        state[index].quality = q;
        if (q.status !== "ok") {
          completed[index] = false;
          WASL_STORE.appendAudit(ASSESS_ID, {
            event: "recording_quality_rejected",
            actor: "system",
            task: tasks[index].key,
            details: { status: q.status, duration_sec: q.duration_sec, snr_db: q.snr_db },
          });
          setState(q.status);
          return;
        }
        let wavBlob;

        try {
          wavBlob = await convertRecordingToWav(blob);
        } catch (error) {
          completed[index] = false;
          setState("uploadfail");
          toast(
            text(
              "تعذّر تجهيز التسجيل بصيغة WAV. يرجى إعادة التسجيل.",
              "The recording could not be prepared as WAV. Please record it again.",
            ),
          );
          return;
        }
        // Persist locally first. The review step sends accepted samples to the model connection.
        const line = () => document.getElementById("uploadLine");
        setState("saved");
        if (line()) {
          line().textContent = text("جارٍ رفع التسجيل…", "Uploading recording…");
          line().className = "upload-line";
        }
        try {
          await WASL_API.uploadRecording(ASSESS_ID, tasks[index].key, wavBlob, {
            duration_sec: q.duration_sec,
            quality: q,
            format: "wav_pcm16_mono",
          });
          completed[index] = true;
          await WASL_STORE.appendAudit(ASSESS_ID, {
            event: "recording_quality_accepted",
            actor: "guardian_child_session",
            task: tasks[index].key,
            details: {
              duration_sec: q.duration_sec,
              snr_db: q.snr_db,
              clipping_pct: q.clipping_pct,
            },
          });
          if (line()) {
            line().textContent = text("تم حفظ التسجيل بنجاح", "Recording saved successfully");
            line().className = "upload-line ok";
          }
          $("#nextBtn").disabled = false;
          await refreshPlayback();
          toast(text("أحسنت، اكتملت هذه المهمة", "Great job, this task is complete"));
        } catch (e) {
          completed[index] = false;
          setState("uploadfail");
        }
      }

      async function reRecord() {
        const taskKey = tasks[index].key;
        await WASL_STORE.deleteRecording(ASSESS_ID, tasks[index].key);
        await WASL_STORE.appendAudit(ASSESS_ID, {
          event: "recording_deleted_for_retake",
          actor: "guardian_child_session",
          task: taskKey,
        });
        if (curURL) {
          URL.revokeObjectURL(curURL);
          curURL = null;
        }
        state[index] = { status: "idle" };
        completed[index] = false;
        setState("idle");
      }

      /* ----- save & exit (real) ----- */
      async function saveAndExit() {
        try {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            await new Promise((res) => {
              mediaRecorder.onstop = async () => {
                clearInterval(timerId);
                if (stream) {
                  stream.getTracks().forEach((t) => t.stop());
                  stream = null;
                }
                res();
              };
              mediaRecorder.stop();
            });
          }
        } catch (e) {}
        // persist step + completed task metadata (recordings already in IndexedDB)
        const doneKeys = tasks.filter((t, i) => completed[i]).map((t) => t.key);
        await WASL_STORE.patchAssessment(ASSESS_ID, {
          status: "in_progress",
          last_step: "audio",
          completed_tasks: doneKeys,
        });
        if (!WASL_STORE.isPersistent()) {
          toast(
            text(
              "تعذّر الحفظ الدائم على هذا المتصفح. أبقي الصفحة مفتوحة أو شغّل الموقع عبر خادم محلي.",
              "Persistent saving is unavailable in this browser. Keep the page open or serve the site locally.",
            ),
          );
          return;
        }
        WASL_STORE.setResume({
          assessment_id: ASSESS_ID,
          url: "audio.html",
          step: "audio",
          label_ar: "مهام النطق والصوت",
          label_en: "Speech & voice tasks",
        });
        toast(
          text(
            "تم حفظ التقدم. سيظهر التقييم «قيد الإنجاز» في لوحة المواعيد.",
            "Progress saved. The assessment will show as “In progress”.",
          ),
        );
        setTimeout(() => (location.href = "dashboard.html"), 1100);
      }

      $("#nextBtn").onclick = async () => {
        if (!completed[index]) return;
        if (index < tasks.length - 1) {
          index++;
          render();
        } else {
          await WASL_STORE.patchAssessment(ASSESS_ID, { status: "in_progress", last_step: "audio_done" });
          WASL_STORE.setResume({
            assessment_id: ASSESS_ID,
            url: "review.html",
            step: "review",
            label_ar: "مراجعة وإرسال التقييم",
            label_en: "Review & submit",
          });
          location.href = "review.html";
        }
      };
      $("#prevBtn").onclick = () => {
        if (index > 0) {
          index--;
          render();
        }
      };
      $("#exitBtn").onclick = saveAndExit;

      window.setLang = function (n) {
        lang = n;
        document.documentElement.lang = n;
        document.documentElement.dir = n === "ar" ? "rtl" : "ltr";
        document.querySelectorAll("[data-ar][data-en]").forEach((e) => (e.textContent = e.dataset[n]));
        const lb = document.getElementById("langBtn");
        if (lb) lb.textContent = n === "ar" ? "EN" : "ع";
        if (typeof render === "function") render();
      };
      $("#langBtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");
      function toast(msg) {
        const x = $("#toast");
        x.textContent = msg;
        x.classList.add("show");
        setTimeout(() => x.classList.remove("show"), 2600);
      }

      function showPractice() {
        $("#practiceOverlay").classList.add("show");
      }

      $$('[data-practice-choice]').forEach((button) => {
        button.onclick = () => {
          const correct = button.dataset.practiceChoice === "ball";
          $$('[data-practice-choice]').forEach((candidate) => {
            candidate.style.borderColor = candidate === button ? "var(--violet)" : "var(--line)";
          });
          $("#practiceResult").textContent = correct
            ? text("أحسنت! أصبحت جاهزًا للبدء.", "Great! You are ready to start.")
            : text("جرّب مرة أخرى واختر الكرة.", "Try again and choose the ball.");
          $("#practiceStart").disabled = !correct;
        };
      });

      $("#practiceStart").onclick = async () => {
        await WASL_STORE.patchAssessment(ASSESS_ID, { practice_completed: true });
        await WASL_STORE.appendAudit(ASSESS_ID, {
          event: "practice_completed",
          actor: "guardian_child_session",
          task: "practice",
        });
        $("#practiceOverlay").classList.remove("show");
      };

      /* restore previously-saved recordings for this assessment (resume) */
      (async function initExisting() {
        try {
          const assessment = await WASL_STORE.getAssessment(ASSESS_ID);
          if (!assessment || !assessment.practice_completed) {
            showPractice();
          }
          const answers = (assessment && assessment.answers) || {};
          const grade = answers.grade;
          const concerns = Array.isArray(answers.concerns) ? answers.concerns : [];
          const hearingOutcome = assessment && assessment.hearing && assessment.hearing.outcome;
          if (grade === "na" || grade === "kg") {
            tasks = tasks.filter((task) => task.key !== "reading");
            taskPlan = {
              profile: "early_years",
              reason_ar: "مهام مبسطة دون قراءة للفئة العمرية المبكرة",
              reason_en: "Simplified non-reading plan for an early-years child",
            };
          }
          if (concerns.includes("fluency")) {
            tasks.push(conversationTask);
            taskPlan = {
              profile: "fluency_focus",
              reason_ar: "أضيفت عينة كلام تلقائي بسبب ملاحظة تتعلق بالطلاقة",
              reason_en: "A spontaneous speech sample was added because fluency was reported",
            };
          }
          if (hearingOutcome === "refer") {
            taskPlan.hearing_follow_up = true;
          }
          const plannedTasks = tasks.map((task) => task.key);
          const previousTasks = assessment && assessment.task_plan && assessment.task_plan.tasks;
          const planChanged = JSON.stringify(previousTasks || []) !== JSON.stringify(plannedTasks);
          await WASL_STORE.patchAssessment(ASSESS_ID, {
            task_plan: {
              ...taskPlan,
              tasks: plannedTasks,
              hearing_follow_up: hearingOutcome === "refer",
            },
          });
          if (planChanged) {
            await WASL_STORE.appendAudit(ASSESS_ID, {
              event: "adaptive_task_plan_created",
              actor: "system",
              details: { profile: taskPlan.profile, tasks: plannedTasks },
            });
          }
          const metas = await WASL_STORE.listRecordingsMeta(ASSESS_ID);
          metas.forEach((m) => {
            const i = tasks.findIndex((t) => t.key === m.task);
            if (i > -1) {
              state[i] = { status: "saved", quality: m.quality };
              completed[i] = true;
            }
          });
        } catch (e) {}
        render();
      })();
    </script>
  </body>
</html>
