<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="نموذج واجهات صحتي للجوال وفق تصميم وصل المرفق.">
    <title>صحتي — وصل</title>
    <link rel="stylesheet" href="assets/wasl-fonts.css">
    <style>
:root {
  --green: #19845a;
  --navy: #173b67;
  --text: #222f3a;
  --muted: #929fa9;
  --line: #d6d9dc;
  --background: #f7f8f9;
  --mint: #f3faf6;
  --app-width: 430px;
  --nav-height: 87px;
}

* {
  box-sizing: border-box;
}

html {
  background: #e6e9ea;
}

body {
  margin: 0;
  color: var(--text);
  font: 1rem/1.5 Tajawal, Arial, sans-serif;
}

button,
input,
select {
  font: inherit;
}

button,
a,
input,
select {
  -webkit-tap-highlight-color: transparent;
}

button,
a {
  touch-action: manipulation;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 3px solid #28a0a0;
  outline-offset: 3px;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1 {
  font-size: 1.42rem;
  line-height: 1.45;
}

h2 {
  font-size: 1.26rem;
  line-height: 1.5;
}

h3 {
  font-size: 1.1rem;
}

svg {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  vertical-align: middle;
}

.phone-app {
  position: relative;
  width: min(100%, var(--app-width));
  min-height: 100svh;
  margin: 0 auto;
  background: var(--background);
  box-shadow: 0 0 35px #243c4212;
}

#screen {
  min-height: 100svh;
  padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom));
  outline: none;
}

.screen-reader {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

.icon-button {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  background: transparent;
  color: var(--green);
  padding: 6px;
}

.icon-button svg {
  width: 30px;
  height: 30px;
}

.green-button {
  width: 100%;
  min-height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 11px;
  padding: 12px 16px;
  color: white;
  background: var(--green);
  font-size: 1.25rem;
  line-height: 1.4;
}

.green-button:disabled {
  background: #9aafc1;
  color: #fff;
}

.green-button:not(:disabled):active {
  background: #10683f;
}

.plain-button {
  border: 0;
  min-height: 44px;
  padding: 8px 10px;
  background: transparent;
  color: var(--green);
}

.app-header {
  height: 106px;
  display: grid;
  grid-template-columns: 50px minmax(0, 1fr) 50px;
  align-items: center;
  padding: 23px 13px 16px;
  border-bottom: 1px solid #e1e4e7;
}

.app-header h1 {
  text-align: center;
  font-size: 1.25rem;
  color: #1e2843;
}

.app-header .icon-button {
  color: #1e2843;
}

.app-header .cancel {
  font-size: .95rem;
  font-weight: 700;
  padding: 8px 0;
}

.bottom-navigation {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  position: fixed;
  bottom: 0;
  inset-inline: 0;
  width: min(100%, var(--app-width));
  margin: auto;
  min-height: var(--nav-height);
  padding: 5px 12px calc(11px + env(safe-area-inset-bottom));
  background: white;
  z-index: 20;
}

.bottom-navigation a,
.bottom-navigation button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 0;
  min-height: 67px;
  padding: 4px 2px;
  border: 0;
  border-radius: 50px;
  background: transparent;
  color: #151515;
  font-size: .9rem;
}

.bottom-navigation svg {
  width: 32px;
  height: 32px;
  color: #777c85;
}

.bottom-navigation .active {
  background: #ededed;
  color: var(--green);
  font-weight: 700;
}

.bottom-navigation .active svg {
  color: var(--green);
}

.home {
  background: radial-gradient(ellipse at 30% 0%, #cee2d9 0, transparent 30%),
    linear-gradient(#e3efea, var(--background) 31%);
  padding: 60px 20px 0;
}

.home-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 36px;
}

.toolbar-buttons {
  display: flex;
  align-items: center;
  gap: 3px;
}

.sehhaty-mark {
  width: 68px;
  height: auto;
  display: block;
}

.notification {
  position: relative;
}

.notification::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 7px;
  top: 7px;
  left: 7px;
  background: #e77da0;
  border-radius: 50%;
}

.welcome h1 {
  font-size: 1.75rem;
  font-weight: 400;
  color: #080b0c;
}

.welcome p {
  margin-top: 6px;
  color: #4c5665;
  font-size: 1.17rem;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 6px 10px;
  min-height: 58px;
}

.home .search-box {
  margin-top: 25px;
  margin-bottom: 25px;
}

.search-box input {
  min-width: 0;
  width: 100%;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
  font-size: 1.12rem;
}

.search-box input::placeholder {
  color: #b7bdc1;
  opacity: 1;
}

.search-box:focus-within {
  border-color: var(--green);
}

.home .search-box .icon-button {
  background: var(--mint);
  border-radius: 12px;
  width: 42px;
  height: 42px;
  flex-shrink: 0;
}

.wasl-banner {
  display: block;
  width: calc(100% + 6px);
  margin-inline: -3px;
  border: 0;
  border-radius: 15px;
  padding: 0;
  background: #f4f7fb;
  overflow: hidden;
}

.wasl-banner img,
.health-banner img {
  display: block;
  width: 100%;
  height: auto;
}

.carousel-dots {
  display: flex;
  justify-content: center;
  direction: ltr;
  gap: 12px;
  padding: 11px 0 25px;
}

.carousel-dots span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: white;
}

.carousel-dots span:first-child {
  background: var(--green);
}

.activity-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #f5fcf8;
  padding: 22px 18px 18px;
  margin: 0 7px 29px;
}

.activity-card h2 {
  font-size: 1.37rem;
  font-weight: 400;
  margin-bottom: 18px;
}

.activity-message {
  margin: 0 0 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  padding: 20px 17px;
  text-align: right;
}

.activity-message p:first-child {
  font-size: 1.13rem;
}

.activity-message p + p {
  color: #a0b3c6;
  font-size: 1.02rem;
  margin-top: 8px;
  line-height: 1.7;
}

.health-banner {
  position: relative;
  min-height: 158px;
  display: flex;
  align-items: center;
  overflow: hidden;
  margin: 0 7px 26px;
  padding: 25px 22px 25px 145px;
  color: white;
  background: linear-gradient(110deg, #304a86 0%, #31527f 43%, #287d73 100%);
  border-radius: 14px;
}

.health-banner img {
  position: absolute;
  top: -6%;
  bottom: auto;
  left: -7px;
  width: 190px;
  height: 112%;
  object-fit: cover;
  object-position: left center;
  opacity: .98;
  -webkit-mask-image: linear-gradient(to right, #000 0 68%, transparent 100%);
  mask-image: linear-gradient(to right, #000 0 68%, transparent 100%);
}

.health-banner-copy {
  position: relative;
  z-index: 1;
  text-align: right;
}

.health-banner-copy h2 {
  color: white;
  font-size: 1.2rem;
  line-height: 1.55;
  margin-bottom: 8px;
}

.health-banner-copy p {
  color: #e9f5f2;
  font-size: .9rem;
  line-height: 1.65;
}

@media (max-width: 360px) {
  .health-banner {
    padding-inline: 18px 116px;
  }

  .health-banner img {
    width: 148px;
  }

  .health-banner-copy h2 {
    font-size: 1.05rem;
  }
}

.health-banner {
  overflow: hidden;
}

.map-header {
  position: relative;
  height: 98px;
  background: #f0edcf url("assets/sehhaty-map.png") center / cover no-repeat;
}

.map-header .icon-button {
  position: absolute;
  top: 35px;
  right: 2px;
  width: 40px;
  background: white;
  border-radius: 9px;
  color: #172a33;
}

.facility-sheet {
  margin-top: -3px;
  padding: 12px 21px calc(132px + env(safe-area-inset-bottom));
  background: white;
  border-radius: 19px 19px 0 0;
  position: relative;
  min-height: calc(100svh - 95px);
}

.sheet-handle {
  width: 97px;
  height: 4px;
  border-radius: 10px;
  background: #d5d7d9;
  margin: 0 auto 14px;
}

.matching-note {
  width: fit-content;
  max-width: 100%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border: 1px solid #ececec;
  border-radius: 6px;
  margin: 0 0 5px;
  font-size: .56rem;
  color: #4e5050;
}

.matching-note strong {
  display: block;
  color: #2694c4;
  font-size: .75rem;
}

.matching-note .stack-icon {
  width: 25px;
  height: 28px;
  display: block;
  border-radius: 4px;
  background: linear-gradient(135deg, #398fb9, #6262bb);
  box-shadow: 4px -3px 0 #72c8a5;
  flex-shrink: 0;
}

.facility-sheet h1 {
  font-size: 1.4rem;
  margin-bottom: 23px;
}

.facility-search {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 21px;
}

.facility-search .search-box {
  flex: 1;
  min-width: 0;
  min-height: 52px;
}

.facility-search .search-box svg {
  color: #9caeb8;
}

.filter-button {
  background: #f4fbf7;
  border-radius: 10px;
  flex-shrink: 0;
}

.sort-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 31px;
}

.sort-options button {
  border: 1px solid var(--line);
  background: white;
  color: #30363b;
  padding: 9px 4px;
  min-height: 50px;
  border-radius: 11px;
  font-size: 1.15rem;
}

.sort-options button.active {
  color: #3c9075;
  background: #f3f5fc;
  border-color: #cbd1d9;
}

.sort-options button.active[data-sort="date"] {
  border-color: #4d8c75;
}

.facility-card {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) 69px;
  align-items: start;
  gap: 8px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 20px 14px 24px;
  margin-bottom: 13px;
  min-height: 157px;
  cursor: pointer;
}

input[type="radio"] {
  appearance: none;
  -webkit-appearance: none;
  width: 26px;
  height: 26px;
  margin: 4px 0 0;
  border: 1.5px solid #83858d;
  border-radius: 50%;
  background: white;
  flex-shrink: 0;
}

input[type="radio"]:checked {
  border-color: var(--green);
  background: radial-gradient(circle, var(--green) 0 43%, white 46%);
}

.facility-name {
  color: var(--navy);
  font-weight: 700;
  font-size: 1.01rem;
  line-height: 1.6;
}

.facility-area {
  font-size: .86rem;
  color: #292d2b;
  margin-top: 5px;
}

.stars {
  display: flex;
  justify-content: center;
  gap: 8px;
  color: #e4e6e9;
  margin-top: 23px;
  font-size: 1.6rem;
  line-height: 1;
  direction: ltr;
}

.distance {
  color: var(--green);
  text-align: center;
  font-size: .96rem;
  font-weight: 700;
  padding-top: 1px;
}

.distance svg {
  display: block;
  width: 28px;
  height: 28px;
  margin: 0 auto 14px;
  stroke-width: 2.7;
}

.facility-footer {
  position: fixed;
  width: min(100%, var(--app-width));
  bottom: 0;
  left: 0;
  right: 0;
  margin: auto;
  padding: 20px 21px calc(18px + env(safe-area-inset-bottom));
  background: white;
  z-index: 22;
}

.filter-panel {
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 15px;
}

.filter-panel select {
  display: block;
  width: 100%;
  margin-top: 8px;
  border: 1px solid var(--line);
  padding: 8px;
  background: white;
  border-radius: 7px;
}

.progress-area {
  padding: 24px 22px 17px;
}

.step-label {
  color: #3e9b7b;
  margin-bottom: 12px;
  font-size: 1.05rem;
}

.progress-area h1 {
  font-size: 1.35rem;
  margin-bottom: 23px;
}

.progress-bars {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
}

.progress-bars span {
  height: 5px;
  border-radius: 7px;
  background: #dce5fb;
}

.progress-bars span.complete {
  background: var(--green);
}

.doctor-search {
  margin: 3px 22px 24px;
  min-height: 51px;
  border-radius: 50px;
}

.doctor-search svg {
  color: #a1acb5;
}

.doctor-list {
  padding: 17px 12px;
  background: white;
}

.doctor-list h2 {
  margin: 0 10px 16px;
  font-size: 1.2rem;
}

.doctor-card {
  display: grid;
  grid-template-columns: 27px minmax(0, 1fr) 32px;
  gap: 8px;
  align-items: start;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 10px;
  background: white;
  cursor: pointer;
}

.doctor-card h3,
.doctor-card p {
  color: var(--navy);
  font-size: 1rem;
  font-weight: 700;
}

.doctor-card small {
  grid-column: 1 / -1;
  font-size: .7rem;
  color: #4c4f50;
  line-height: 1.6;
}

.doctor-card .person-icon {
  color: var(--green);
  background: var(--mint);
  padding: 3px;
  border-radius: 8px;
}

.doctor-view {
  display: flex;
  flex-direction: column;
  min-height: calc(100svh - var(--nav-height));
}

.doctor-actions {
  margin-top: auto;
  padding: 25px 22px 0;
  text-align: center;
  background: white;
}

.doctor-actions .plain-button {
  margin-top: 8px;
  font-size: 1.08rem;
}

.calendar-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: #e1e7eb;
  border-radius: 12px;
  padding: 6px;
  margin: 5px 22px 23px;
}

.calendar-toggle button {
  border: 0;
  border-radius: 5px;
  padding: 5px;
  color: white;
  background: none;
  min-height: 35px;
  font-weight: 700;
  font-size: 1.15rem;
}

.calendar-toggle .active {
  color: #3d9173;
  background: white;
}

.calendar {
  padding: 0 21px;
  background: white;
}

.month-nav {
  display: flex;
  align-items: center;
  gap: 2px;
  justify-content: flex-start;
  padding: 9px 0 5px;
}

.month-nav strong {
  font-size: 1.09rem;
  text-align: center;
}

.month-nav .icon-button {
  width: 33px;
  height: 42px;
}

.month-nav svg {
  width: 18px;
  height: 18px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 3px;
}

.weekday {
  text-align: center;
  font-size: .75rem;
  color: #414d4f;
  padding: 12px 0 15px;
}

.day {
  min-width: 0;
  min-height: 44px;
  padding: 3px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #3b4547;
  font-size: 1.02rem;
}

.day.selected {
  color: white;
  background: var(--green);
}

.day:disabled {
  color: #c3c9cb;
}

.more-days {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 13px;
  width: calc(100% + 42px);
  margin: 12px -21px 0;
  padding: 13px;
  border: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: white;
  color: #4c9d83;
  min-height: 50px;
  font-size: 1.07rem;
}

.time-section {
  padding: 25px 23px 21px;
}

.time-section h2 {
  font-size: 1.1rem;
  margin-bottom: 18px;
}

.times {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.time-button {
  min-height: 45px;
  padding: 7px 2px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: white;
  color: #3d494e;
  font-size: 1.04rem;
}

.time-button.selected {
  color: #478c78;
  border: 1.5px solid var(--green);
  background: #f3faf8;
}

.selected-date {
  padding: 24px 22px 12px;
  background: white;
  color: #414e51;
}

.selected-date p:first-child {
  font-size: 1rem;
  margin-bottom: 14px;
}

.selected-date p:last-child {
  font-size: 1.15rem;
  line-height: 1.6;
}

.date-actions {
  position: sticky;
  bottom: calc(var(--nav-height) + env(safe-area-inset-bottom));
  z-index: 12;
  padding: 9px 22px 14px;
  background: white;
  box-shadow: 0 -8px 20px #163a2b0d;
}

.review-list {
  padding: 3px 22px 12px;
}

.review-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 21px 18px;
  min-height: 102px;
  margin-bottom: 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
}

.review-icon {
  width: 41px;
  height: 44px;
  padding: 6px;
  border-radius: 10px;
  background: var(--mint);
  color: var(--green);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.review-icon svg {
  width: 30px;
  height: 30px;
}

.review-details {
  flex: 1;
  min-width: 0;
}

.review-details small {
  display: block;
  font-size: 1rem;
  color: #4b5560;
  margin-bottom: 4px;
}

.review-details p {
  font-size: 1.23rem;
  line-height: 1.45;
  color: #171d1d;
  overflow-wrap: anywhere;
}

.review-change {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  min-height: 44px;
  border: 0;
  background: transparent;
  color: #238762;
  font-size: 1.03rem;
}

.review-change svg {
  width: 14px;
}

.review-footer {
  position: sticky;
  bottom: calc(var(--nav-height) + env(safe-area-inset-bottom));
  z-index: 12;
  background: white;
  padding: 22px 22px 20px;
  box-shadow: 0 -8px 20px #163a2b0d;
}

.triage-summary {
  margin: 18px 0;
  padding: 16px;
  border: 1px solid #cfe6dc;
  border-radius: 16px;
  background: #f4fbf8;
}

.triage-summary small,
.triage-summary strong,
.triage-summary span {
  display: block;
}

.triage-summary small {
  color: #377863;
  font-weight: 700;
}

.triage-summary strong {
  margin: 7px 0 5px;
  color: #182f3c;
  font-size: 1.05rem;
}

.triage-summary span {
  color: #63747b;
  font-size: .9rem;
  line-height: 1.7;
}

.triage-links {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 13px;
}

.triage-links a {
  min-height: 42px;
  display: grid;
  place-items: center;
  padding: 9px 12px;
  border: 1px solid #b9dccd;
  border-radius: 11px;
  background: white;
  color: #187454;
  font-size: .86rem;
  font-weight: 800;
  text-decoration: none;
}

.empty-message {
  padding: 25px 15px;
  text-align: center;
  color: #737f86;
}

.appointment-content {
  padding: 25px 21px;
}

.appointment-content .green-button {
  margin-top: 22px;
}

dialog {
  width: min(calc(100% - 32px), 390px);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 23px;
  color: var(--text);
  background: white;
}

dialog::backdrop {
  background: #152b2466;
}

dialog h2 {
  margin-bottom: 15px;
}

.dialog-close {
  margin-top: 22px;
  font-size: 1rem;
  min-height: 46px;
}

.dialog-menu {
  display: grid;
  gap: 8px;
}

.dialog-menu a {
  display: block;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
}

@media (max-width: 360px) {
  .home {
    padding-inline: 17px;
  }

  .facility-sheet {
    padding-inline: 14px;
  }

  .facility-card {
    grid-template-columns: 25px minmax(0, 1fr) 59px;
    padding-inline: 11px;
    gap: 5px;
  }

  .facility-name {
    font-size: .95rem;
  }

  .stars {
    gap: 5px;
  }

  .review-list {
    padding-inline: 15px;
  }

  .review-card {
    padding-inline: 12px;
    gap: 8px;
  }

  .review-details p {
    font-size: 1.08rem;
  }

  .review-change {
    font-size: .9rem;
  }
}

@media print {
  html,
  body,
  .phone-app {
    background: white;
  }

  .bottom-navigation,
  .review-change,
  .review-footer,
  .app-header button {
    display: none;
  }

  .phone-app {
    box-shadow: none;
  }
}

function icon(name) {

function escapeText(value) {
  return String(value).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  })[character]);
}

function go(route) {

function dateKey(date) {
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"),

}

function parseDate(key) {
  const [year, month, day] = key.split("-").map(Number);
  return new Date(year, month - 1, day);
}

function formatDate(key) {
  const date = parseDate(key);
  const month = new Intl.DateTimeFormat("ar-SA", {
    month: "long", calendar: state.calendar,
  }).format(date);
  const day = new Intl.DateTimeFormat("en", {
    day: "2-digit", calendar: state.calendar,
  }).format(date);
  const year = new Intl.DateTimeFormat("en", {
    year: "numeric", calendar: state.calendar,
  }).format(date);
  return `${day} ${month} ${year}`;
}

function calendarParts(date) {
  const formatter = new Intl.DateTimeFormat("en-u-nu-latn", {
    calendar: state.calendar,
    year: "numeric",
    month: "numeric",
    day: "numeric",
  });
  return Object.fromEntries(formatter.formatToParts(date).map(part => [part.type, part.value]));
}

function firstOfDisplayMonth(date) {
  const first = new Date(date);
  while (Number(calendarParts(first).day) !== 1) first.setDate(first.getDate() - 1);
  return first;
}

function changeMonth(amount) {
  const first = firstOfDisplayMonth(state.month);
  if (amount < 0) {
    first.setDate(first.getDate() - 1);
    state.month = firstOfDisplayMonth(first);
  } else {
    const month = calendarParts(first).month;
    while (calendarParts(first).month === month) first.setDate(first.getDate() + 1);
    state.month = first;
  }
}

function renderCalendar() {
  const first = firstOfDisplayMonth(state.month);
  const parts = calendarParts(first);
  const title = new Intl.DateTimeFormat("ar-SA", {
    calendar: state.calendar,
    month: "long",
    year: "numeric",
    numberingSystem: "arab",
  }).format(first);
  let days = [];
  if (state.expanded) {
    days = Array(first.getDay()).fill(null);
    const cursor = new Date(first);
    while (calendarParts(cursor).month === parts.month) {
      days.push(new Date(cursor));
      cursor.setDate(cursor.getDate() + 1);
    }
  } else {
    const selected = parseDate(state.date || SEHHATY_DATA.referenceDate);
    const belongs = calendarParts(selected).month === parts.month && calendarParts(selected).year === parts.year;
    const cursor = belongs ? selected : new Date(first);
    cursor.setDate(cursor.getDate() - cursor.getDay());
    days = Array.from({ length: 7 }, (_, index) => {
      const day = new Date(cursor);
      day.setDate(day.getDate() + index);
      return day;
    });
  }
  const label = date => new Intl.DateTimeFormat("en", {
    calendar: state.calendar,
    day: "2-digit",
  }).format(date);
  document.getElementById("calendar-content").innerHTML = `
    <div class="month-nav"><button class="icon-button" data-month="1" aria-label="الشهر التالي">${icon("back")}</button><strong>${title}</strong><button class="icon-button" data-month="-1" aria-label="الشهر السابق">${icon("forward")}</button></div>
    <div class="calendar-grid">${["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"].map(day => `<span class="weekday">${day}</span>`).join("")}
    ${days.map(day => day ? `<button class="day ${dateKey(day) === state.date ? "selected" : ""}" data-date="${dateKey(day)}" aria-label="${formatDate(dateKey(day))}" aria-pressed="${dateKey(day) === state.date}">${label(day)}</button>` : '<span aria-hidden="true"></span>').join("")}</div>
    <button class="more-days" data-action="more-days" aria-expanded="${state.expanded}">${state.expanded ? "عرض أقل" : "عرض المزيد"}${icon("down")}</button>`;
  renderTimes();
}

function renderTimes() {
  document.getElementById("time-list").innerHTML = SEHHATY_DATA.times.map(time => `
    <button class="time-button ${state.time === time ? "selected" : ""}" data-time="${time}" aria-pressed="${state.time === time}"><bdi>${time}</bdi> ص</button>`).join("");
  document.getElementById("selected-date").innerHTML = state.date
    ? `${formatDate(state.date)}${state.time ? ` | <bdi>${state.time}</bdi> ص` : ""}`
    : "لم يتم اختيار تاريخ بعد";
  document.getElementById("date-next").disabled = !state.date || !state.time;
}

function reviewCard(iconName, title, value, route = "") {
  return `<div class="review-card">
    <span class="review-icon">${icon(iconName)}</span>
    <div class="review-details">
      <small>${title}</small>
      <p>${escapeText(value)}</p>
    </div>
    ${
      route
        ? `<button class="review-change" data-go="${route}" aria-label="تغيير ${title}">
            تغيير${icon("forward")}
          </button>`
        : ""
    }
  </div>`;
}

function reviewPage() {
  return `${appHeader("date")}${progress(5, "الرجاء مراجعة التفاصيل قبل تأكيد الحجز:")}
    <section class="review-list">
      ${reviewCard("user", "المراجع", SEHHATY_DATA.patient)}
      ${reviewCard("clinic", "نوع الموعد", SEHHATY_DATA.appointmentType)}
      ${reviewCard("pin", "المنشأة", state.facility.bookingName, "facilities")}
      ${reviewCard("stethoscope", "الخدمة", guardianService())}
      ${reviewCard("calendar", "التاريخ والوقت", `${formatDate(state.date)}, ${state.time} ص`, "date")}
    </section>
    <div class="review-footer"><button class="green-button" data-action="confirm">تأكيد الحجز</button></div>`;
}

function appointmentsPage() {
  const booking = state.booking;
  return `${appHeader("home")}<section class="appointment-content"><h1>المواعيد</h1>${booking
    ? `<div style="margin-top:22px">${reviewCard("pin", "المنشأة", booking.facility.bookingName)}${reviewCard("calendar", "التاريخ والوقت", `${formatDate(booking.date)}, ${booking.time} ص`)}</div>`
    : '<p class="empty-message">لا توجد مواعيد محجوزة.</p>'}<button class="green-button" data-go="facilities">حجز موعد</button></section>`;
}

function render() {
  let route = location.hash.slice(1) || "home";
  if (route === "appointment-type" || route === "service") {
    location.hash = "review";
    message(route === "service" ? "الخدمة" : "نوع الموعد", route === "service"
      ? "الخدمة المتاحة في هذا المسار: كشفية في عيادة النطق."
      : "نوع الموعد المتاح في هذا المسار: موعد حضوري.");
    return;
  }
  if (["doctor", "date", "review"].includes(route) && !state.facility) route = "facilities";
  if (["date", "review"].includes(route) && !state.doctorSelected) route = "doctor";
  if (route === "review" && (!state.date || !state.time)) route = "date";
  const pages = { home: homePage, facilities: facilitiesPage, doctor: doctorPage, date: datePage, review: reviewPage, appointments: appointmentsPage };
  if (!pages[route]) route = "home";
  screen.innerHTML = pages[route]();
  screen.style.paddingBottom = route === "facilities" ? "0" : "";
  bottomNav(route);
  if (route === "facilities") {
    document.getElementById("district").value = state.district;
    renderFacilities();
  }
  if (route === "date") renderCalendar();
  screen.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

document.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button || button.disabled) return;
  if (button.dataset.go === "service") {
    message("الخدمة", "الخدمة المتاحة في هذا المسار: كشفية في عيادة النطق.");
    return;
  }
  if (button.dataset.go === "appointment-type") {
    message("نوع الموعد", "نوع الموعد المتاح في هذا المسار: موعد حضوري.");
    return;
  }
  if (button.dataset.go) go(button.dataset.go);
  if (button.dataset.sort) {
    state.sort = button.dataset.sort;
    document.querySelectorAll("[data-sort]").forEach(item => {
      item.classList.toggle("active", item.dataset.sort === state.sort);
      item.setAttribute("aria-pressed", item.dataset.sort === state.sort);
    });
    renderFacilities();
  }
  if (button.dataset.month) {
    changeMonth(Number(button.dataset.month));
    renderCalendar();
  }
  if (button.dataset.calendar) {
    state.calendar = button.dataset.calendar;
    state.month = parseDate(state.date || SEHHATY_DATA.referenceDate);
    document.querySelectorAll("[data-calendar]").forEach(item => {
      item.classList.toggle("active", item.dataset.calendar === state.calendar);
      item.setAttribute("aria-pressed", item.dataset.calendar === state.calendar);
    });
    renderCalendar();
  }
  if (button.dataset.date) {
    state.date = button.dataset.date;
    state.time = "";
    state.confirmed = false;
    renderCalendar();
    document.getElementById("live").textContent = "تم اختيار التاريخ. اختر الوقت المناسب.";
  }
  if (button.dataset.time) {
    state.time = button.dataset.time;
    state.confirmed = false;
    renderTimes();
  }
  const action = button.dataset.action;
  if (action === "filter") {
    const panel = document.getElementById("filter-panel");
    panel.hidden = !panel.hidden;
    button.setAttribute("aria-expanded", !panel.hidden);
  }
  if (action === "more-days") {
    state.expanded = !state.expanded;
    renderCalendar();
  }
  if (action === "first-doctor") {
    state.doctorSelected = true;
    go("date");
  }
  if (action === "cancel") {
    message("إلغاء الحجز", '<p>هل تريد الرجوع إلى الرئيسية؟</p><button class="plain-button" type="button" data-go="home">العودة للرئيسية</button>');
  }
  if (action === "health") message("ربط النشاط الصحي", "يمكنك إدارة صلاحية الوصول إلى بيانات نشاطك الصحي من إعدادات الجهاز.");
  if (action === "support") message("المساعدة", "ابدأ من «احجز الآن»، ثم اختر المنشأة والطبيب والتاريخ والوقت.");
  if (action === "notifications") message("الإشعارات", state.booking ? "لديك موعد محفوظ في قائمة المواعيد." : "لا توجد إشعارات جديدة.");
  if (action === "wellness") message("جودة الحياة", "تابعي خدمات جودة الحياة ونشاطك الصحي من هنا.");
  if (action === "profile") message("ملفي", `<p>${SEHHATY_DATA.patient}</p>`);
  if (action === "menu") message("القائمة", '<div class="dialog-menu"><a href="#home">الرئيسية</a><a href="#facilities">قائمة المنشآت</a><a href="#appointments">المواعيد</a></div>');
  if (action === "confirm") {
    if (!state.facility || !state.doctorSelected || !state.date || !state.time) return;
    if (!state.confirmed) {
      state.booking = { facility: state.facility, date: state.date, time: state.time };
      state.confirmed = true;
      try {
        sessionStorage.setItem("wasl_sehhaty_booking", JSON.stringify({
          facility_id: state.facility.id,
          date: state.date,
          time: state.time,
        }));
      } catch (error) {}
    }
    message("تم تأكيد الحجز", '<p>تم تأكيد موعدك بنجاح.</p><button class="plain-button" type="button" data-go="appointments">عرض الموعد</button>');
  }
});

document.addEventListener("change", event => {
  const input = event.target;
  if (input.name === "facility") {
    if (state.facility?.id !== input.value) {
      state.facility = SEHHATY_DATA.facilities.find(facility => facility.id === input.value);
      state.doctorSelected = false;
      state.date = null;
      state.time = "";
      state.confirmed = false;
    }
    document.getElementById("facility-next").disabled = false;
  }
  if (input.name === "doctor") {
    state.doctorSelected = true;
    document.getElementById("doctor-next").disabled = false;
  }
  if (input.id === "district") {
    state.district = input.value;
    renderFacilities();
  }
});

document.addEventListener("input", event => {
  if (event.target.id === "facility-search") {
    state.query = event.target.value;
    renderFacilities();
  }
  if (event.target.id === "doctor-search") {
    const found = `${SEHHATY_DATA.doctor.name} ${SEHHATY_DATA.doctor.specialty}`.includes(event.target.value.trim());
    document.getElementById("doctor-results").hidden = !found;
    document.getElementById("doctor-empty").hidden = found;
  }
});

document.addEventListener("submit", event => {
  if (event.target.id === "home-search") {
    event.preventDefault();
    const query = new FormData(event.target).get("query").trim();
    if (!query || /نطق|سمع|موعد|وصل|فحص/.test(query)) go("facilities");
    else message("نتائج البحث", "الخدمة المتاحة في هذا النموذج هي حجز موعد للنطق والسمع.");
  }
});

window.addEventListener("hashchange", () => {
  if (dialog.open && !["appointment-type", "service"].includes(location.hash.slice(1))) dialog.close();
  render();
});

async function initialize() {
  try {
    const pointer = WASL_STORE.getResume();
    if (pointer?.assessment_id) {
      const assessment = await WASL_STORE.getAssessment(pointer.assessment_id);
      if (assessment?.status === "clinically_reviewed") guardianResult = assessment;
    }
    const saved = JSON.parse(sessionStorage.getItem("wasl_sehhaty_booking") || "null");
    if (saved?.facility_id) {
      const facility = SEHHATY_DATA.facilities.find(item => item.id === saved.facility_id);
      if (facility) {
        state.booking = { facility, date: saved.date, time: saved.time };
        state.confirmed = true;
      }
    }
  } catch (error) {}
  render();
}

initialize();

    </script>
  </body>
</html>
