<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تسجيل الدخول | وصل</title>
    <link rel="stylesheet" href="assets/wasl-fonts.css" />
    <link rel="stylesheet" href="assets/wasl-enhance.css" />
    <style>
      :root {
        --navy: #102d72;
        --violet: #5653e8;
        --cyan: #09d8d0;
        --line: #dce5f2;
        --muted: #718097;
        --red: #c93e54;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Tajawal, sans-serif;
        color: #17213b;
      }
      body {
        background: radial-gradient(circle at 8% 95%, rgba(9, 216, 208, 0.16), transparent 28%), #f4f7fc;
      }
      .page {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: 76px 1fr;
      }
      .header {
        background: #fff;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 clamp(20px, 5vw, 72px);
      }
      .header-in {
        width: min(1280px, 100%);
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        width: 124px;
        height: 52px;
        object-fit: contain;
      }
      .lang {
        height: 42px;
        padding: 0 18px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--navy);
        font-weight: 800;
      }
      .main {
        display: grid;
        place-items: center;
        padding: 30px;
      }
      .shell {
        width: min(1080px, 100%);
        min-height: 590px;
        display: grid;
        grid-template-columns: 1.02fr 0.98fr;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 25px 70px rgba(17, 45, 114, 0.12);
      }
      .identity {
        position: relative;
        padding: 55px;
        color: #fff;
        background: linear-gradient(145deg, #102d72, #293e9d 65%, #5853e8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
      }
      .identity:before,
      .identity:after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.07);
      }
      .identity:before {
        width: 320px;
        height: 320px;
        top: -160px;
        left: -90px;
      }
      .identity:after {
        width: 220px;
        height: 220px;
        bottom: -100px;
        right: -60px;
      }
      .identity img {
        width: 118px;
        filter: brightness(0) invert(1);
        margin-bottom: 35px;
        position: relative;
      }
      .identity h1 {
        font-size: clamp(2rem, 4vw, 3.1rem);
        line-height: 1.3;
        margin: 0;
        position: relative;
      }
      .identity p {
        font-size: 1.05rem;
        line-height: 1.9;
        color: #dbe3ff;
        max-width: 430px;
        position: relative;
      }
      .secure {
        margin-top: auto;
        position: relative;
        color: #dbe3ff;
        font-size: 0.88rem;
      }
      .form-wrap {
        padding: clamp(38px, 6vw, 72px);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .form-wrap h2 {
        font-size: 2rem;
        color: var(--navy);
        margin: 0 0 7px;
      }
      .intro {
        color: var(--muted);
        margin: 0 0 28px;
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-weight: 700;
        color: var(--navy);
        margin-bottom: 8px;
      }
      .input {
        height: 54px;
        border: 1px solid var(--line);
        border-radius: 14px;
        display: flex;
        align-items: center;
        background: #fbfcff;
        overflow: hidden;
      }
      .input:focus-within {
        border-color: var(--violet);
        box-shadow: 0 0 0 3px rgba(86, 83, 232, 0.1);
      }
      .input input {
        height: 100%;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        padding: 0 16px;
        font: inherit;
      }
      .toggle {
        height: 100%;
        min-width: 46px;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: grid;
        place-items: center;
      }
      .toggle svg {
        width: 22px;
        height: 22px;
      }
      .toggle:hover {
        color: var(--navy);
      }
      .error {
        min-height: 21px;
        color: var(--red);
        font-size: 0.82rem;
        margin-top: -8px;
      }
      .submit {
        height: 56px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(105deg, var(--navy), var(--violet));
        color: #fff;
        font-weight: 800;
        font-size: 1rem;
        box-shadow: 0 12px 25px rgba(86, 83, 232, 0.22);
      }
      .forgot {
        margin-top: 18px;
        text-align: center;
        color: var(--navy);
        text-decoration: none;
        font-weight: 700;
      }
      .support {
        margin-top: 26px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        text-align: center;
        font-size: 0.85rem;
      }
      .portal-links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }
      .portal-link {
        min-height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--navy);
        background: #f7f9fd;
        border: 1px solid var(--line);
        border-radius: 12px;
        text-decoration: none;
        font-size: 0.86rem;
        font-weight: 800;
      }
      .portal-link:hover,
      .portal-link:focus-visible {
        color: var(--violet);
        border-color: var(--violet);
      }
      .spinner {
        display: none;
        width: 20px;
        height: 20px;
        margin: auto;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading .button-text {
        display: none;
      }
      .loading .spinner {
        display: block;
      }
      @media (max-width: 800px) {
        .main {
          padding: 18px;
        }
        .shell {
          grid-template-columns: 1fr;
          min-height: 0;
        }
        .identity {
          padding: 28px;
          min-height: 210px;
        }
        .identity img {
          width: 86px;
          margin-bottom: 16px;
        }
        .identity h1 {
          font-size: 1.8rem;
        }
        .identity p {
          margin-bottom: 0;
        }
        .secure {
          display: none;
        }
        .form-wrap {
          padding: 32px;
        }
      }
      @media (max-width: 480px) {
        .page {
          grid-template-rows: 64px 1fr;
        }
        .header {
          padding: 0 15px;
        }
        .logo {
          width: 102px;
        }
        .main {
          padding: 12px;
        }
        .shell {
          border-radius: 21px;
        }
        .identity {
          min-height: 175px;
          padding: 22px;
        }
        .identity p {
          font-size: 0.9rem;
          line-height: 1.6;
        }
        .form-wrap {
          padding: 27px 22px;
        }
        .form-wrap h2 {
          font-size: 1.65rem;
        }
        .input {
          height: 52px;
        }
      }
    </style>
    <script defer src="assets/wasl-enhance.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-in">
          <img class="logo" src="assets/wasl-logo-1.webp" alt="منصة وصل" /><button class="lang" id="langBtn">EN</button>
        </div>
      </header>
      <main class="main">
        <section class="shell">
          <aside class="identity">
            <img src="assets/wasl-logo-1.webp" alt="وصل" />
            <h1 data-ar="رعاية تبدأ بتوجيهٍ أدق" data-en="Better care starts with better direction">
              رعاية تبدأ بتوجيهٍ أدق
            </h1>
            <p
              data-ar="منصة وطنية للفرز الأولي وتوجيه حالات النطق واللغة والسمع إلى الخدمة المناسبة."
              data-en="A national triage platform that guides speech, language and hearing cases to the right service."
            >
              منصة وطنية للفرز الأولي وتوجيه حالات النطق واللغة والسمع إلى الخدمة المناسبة.
            </p>
          </aside>
          <form class="form-wrap" id="loginForm" novalidate>
            <h2 data-ar="مرحبًا بعودتك" data-en="Welcome back">مرحبًا بعودتك</h2>
            <p
              class="intro"
              data-ar="يرجى تسجيل الدخول للوصول إلى مواعيد اليوم."
              data-en="Sign in to access today's appointments."
            >
              يرجى تسجيل الدخول للوصول إلى مواعيد اليوم.
            </p>
            <div class="field">
              <label for="email" data-ar="البريد الإلكتروني" data-en="Email address">البريد الإلكتروني</label>
              <div class="input">
                <input id="email" type="email" autocomplete="username" placeholder="name@clinic.sa" />
              </div>
            </div>
            <div class="field">
              <label for="password" data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
              <div class="input">
                <input id="password" type="password" autocomplete="current-password" /><button
                  class="toggle"
                  id="toggle"
                  type="button"
                  aria-label="إظهار كلمة المرور"
                >
                  <svg
                    class="eye-open"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" /></svg
                  ><svg
                    class="eye-closed"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="display: none"
                  >
                    <path
                      d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.2 4.2M9.9 5.2A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a16.8 16.8 0 0 1-3.2 4M6.1 6.1A16.9 16.9 0 0 0 2 12s3.6 7 10 7a9.5 9.5 0 0 0 3.9-.8"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <div class="error" id="error" role="alert"></div>
            <button class="submit" id="submit" type="submit">
              <span class="button-text" data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</span
              ><span class="spinner"></span></button
            ><a class="forgot" href="#" id="forgot" data-ar="نسيت كلمة المرور؟" data-en="Forgot your password?"
              >نسيت كلمة المرور؟</a
            >
            <div
              class="support"
              data-ar="للمساعدة، يمكن التواصل مع مسؤول النظام في المنشأة."
              data-en="For help, contact your facility system administrator."
            >
              للمساعدة، يمكن التواصل مع مسؤول النظام في المنشأة.
            </div>
            <nav class="portal-links" aria-label="بوابات وصل">
              <a class="portal-link" href="specialist-login.html" data-ar="بوابة الأخصائيين" data-en="Specialist portal">
                بوابة الأخصائيين
              </a>
              <a class="portal-link" href="facility.html" data-ar="بوابة المنشآت" data-en="Facility portal">
                بوابة المنشآت
              </a>
            </nav>
          </form>
        </section>
      </main>
    </div>
    <script>
      let lang = "ar";
      const $ = (s) => document.querySelector(s),
        $$ = (s) => document.querySelectorAll(s);
      function setLang(n) {
        lang = n;
        document.documentElement.lang = n;
        document.documentElement.dir = n === "ar" ? "rtl" : "ltr";
        $$("[data-ar][data-en]").forEach((x) => (x.textContent = x.dataset[n]));
        $("#langBtn").textContent = n === "ar" ? "EN" : "ع";
        document.title = n === "ar" ? "تسجيل الدخول | وصل" : "Sign in | WASL";
      }
      $("#langBtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");
      $("#toggle").onclick = () => {
        const p = $("#password"),
          show = p.type === "password";
        p.type = show ? "text" : "password";
        $("#toggle .eye-open").style.display = show ? "none" : "block";
        $("#toggle .eye-closed").style.display = show ? "block" : "none";
        $("#toggle").setAttribute(
          "aria-label",
          lang === "ar" ? (show ? "إخفاء كلمة المرور" : "إظهار كلمة المرور") : show ? "Hide password" : "Show password",
        );
      };
      $("#forgot").onclick = (e) => {
        e.preventDefault();
        $("#error").textContent =
          lang === "ar"
            ? "تواصل مع مسؤول النظام لإعادة تعيين كلمة المرور."
            : "Contact your system administrator to reset your password.";
      };
      $("#loginForm").onsubmit = (e) => {
        e.preventDefault();
        const email = $("#email").value.trim(),
          password = $("#password").value;
        if (!/^\S+@\S+\.\S+$/.test(email) || password.length < 4) {
          $("#error").textContent =
            lang === "ar" ? "يرجى إدخال بريد إلكتروني وكلمة مرور صحيحين." : "Enter a valid email address and password.";
          return;
        }
        $("#error").textContent = "";
        $("#submit").classList.add("loading");
        $("#submit").disabled = true;
        setTimeout(() => (location.href = "dashboard.html"), 650);
      };
    </script>
  </body>
</html>
