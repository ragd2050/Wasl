<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>سجل متابعة الطفل | وصل</title>
    <link rel="stylesheet" href="assets/wasl-fonts.css" />
    <link rel="stylesheet" href="assets/wasl-tokens.css" />
    <link rel="stylesheet" href="assets/wasl-enhance.css" />
    <link rel="stylesheet" href="assets/wasl-v29.css" />
    <style>
      .trend-track {
        height: 8px;
        margin-top: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: #e6ebf3;
      }

      .trend-track i {
        height: 100%;
        display: block;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--violet));
      }

      .trend-delta {
        margin-top: 7px;
        color: var(--green);
        font-size: 0.84rem;
        font-weight: 800;
      }

      .trend-delta.down {
        color: var(--amber);
      }
    </style>
  </head>
  <body>
    <header class="v29-header">
      <img class="v29-logo" src="assets/wasl-logo-1.webp" alt="وصل" />
      <div class="v29-header-actions">
        <a class="v29-back" id="backLink" href="guardian-report.html" data-ar="العودة" data-en="Back">العودة</a>
        <button class="v29-lang" id="langBtn" type="button">EN</button>
      </div>
    </header>

    <main class="v29-shell">
      <section class="v29-card" aria-labelledby="pageTitle">
        <span class="v29-eyebrow" data-ar="متابعة مستمرة" data-en="Ongoing follow-up">متابعة مستمرة</span>
        <h1 class="v29-title" id="pageTitle" data-ar="سجل تقييمات سارة" data-en="Sara's assessment history">سجل تقييمات سارة</h1>
        <p
          class="v29-lead"
          data-ar="يجمع السجل الزيارات التي اعتمدها المختص، ويساعد على متابعة الخطة بمرور الوقت دون اعتباره تشخيصًا."
          data-en="This history brings together specialist-approved visits to support follow-up over time. It is not a diagnosis."
        >
          يجمع السجل الزيارات التي اعتمدها المختص، ويساعد على متابعة الخطة بمرور الوقت دون اعتباره تشخيصًا.
        </p>

        <div class="v29-notice" id="historySummary" role="status"></div>
        <div class="v29-history" id="historyList"></div>
      </section>
    </main>

    <script src="assets/wasl-store.js"></script>
    <script src="assets/wasl-patient.js"></script>
    <script>
      const $ = (selector) => document.querySelector(selector);
      const specialistView = new URLSearchParams(location.search).get("view") === "specialist";
      let lang = "ar";
      let visits = [];

      const PRIORITY = {
        low: { ar: "اعتيادية", en: "Routine" },
        medium: { ar: "قريبة", en: "Timely" },
        high: { ar: "مرتفعة", en: "High" },
      };

      const SERVICE = {
        SPEECH_LANGUAGE_ASSESSMENT: { ar: "النطق واللغة", en: "Speech and language" },
        SLP_ASSESSMENT: { ar: "النطق واللغة", en: "Speech and language" },
        AUDIOLOGY_ASSESSMENT: { ar: "السمع", en: "Audiology" },
        MULTIDISCIPLINARY_ASSESSMENT: { ar: "النطق والسمع", en: "Speech and audiology" },
      };

      const DOMAINS = [
        { key: "speech_clarity_index", ar: "وضوح الكلام", en: "Speech clarity" },
        { key: "expressive_length_index", ar: "التعبير اللغوي", en: "Expressive language" },
        { key: "fluency_index", ar: "طلاقة الكلام", en: "Speech fluency" },
      ];

      function text(ar, en) {
        return lang === "ar" ? ar : en;
      }

      function formatDate(value) {
        return new Date(value || Date.now()).toLocaleDateString(lang === "ar" ? "ar-SA" : "en-GB", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });
      }

      function priorityOf(visit) {
        return visit.clinical_review?.priority || visit.result?.priority?.level || "medium";
      }

      function serviceOf(visit) {
        const code = visit.clinical_review?.service || visit.result?.recommended_service?.code;
        const label = SERVICE[code];
        return label ? label[lang] : text("تقييم متخصص", "Specialist assessment");
      }

      function metricOf(visit, key) {
        return Number(visit.result?.evidence?.speech_features?.[key]);
      }

      function renderDomains(visit, previous) {
        if (!specialistView) return "";
        return `<div class="v29-bars">${DOMAINS.map((domain) => {
          const value = metricOf(visit, domain.key);
          if (!Number.isFinite(value)) return "";
          const percent = Math.max(0, Math.min(100, Math.round(value * 100)));
          const priorValue = previous ? metricOf(previous, domain.key) : NaN;
          const delta = Number.isFinite(priorValue) ? Math.round((value - priorValue) * 100) : null;
          return `<div class="v29-domain">
            <span>${text(domain.ar, domain.en)}</span>
            <strong>${percent}%</strong>
            <div class="trend-track" aria-label="${text(domain.ar, domain.en)} ${percent}%"><i style="width:${percent}%"></i></div>
            ${delta == null ? "" : `<div class="trend-delta ${delta < 0 ? "down" : ""}">${delta > 0 ? "+" : ""}${delta} ${text("نقطة عن الزيارة السابقة", "points vs previous visit")}</div>`}
          </div>`;
        }).join("")}</div>`;
      }

      function render() {
        $("#backLink").href = specialistView ? "specialist-cases.html" : "guardian-report.html";
        $("#historySummary").textContent = visits.length > 1
          ? text(
              `يتوفر ${visits.length} تقييمات معتمدة للمقارنة.`,
              `${visits.length} approved assessments are available for comparison.`,
            )
          : text(
              "هذه الزيارة هي خط البداية. ستظهر المقارنة تلقائيًا بعد اعتماد التقييم القادم.",
              "This visit is the baseline. Comparison will appear after the next assessment is approved.",
            );

        if (!visits.length) {
          $("#historyList").innerHTML = `<div class="v29-empty">${text(
            "لا توجد زيارات معتمدة حتى الآن.",
            "No approved visits are available yet.",
          )}</div>`;
          return;
        }

        $("#historyList").innerHTML = visits
          .map((visit, index) => {
            const review = visit.clinical_review || {};
            const previous = visits[index + 1] || null;
            const priority = PRIORITY[priorityOf(visit)] || PRIORITY.medium;
            return `<article class="v29-visit">
              <div class="v29-visit-head">
                <div>
                  <h2>${formatDate(review.reviewed_at || visit.updated_at)}</h2>
                  <p>${text("رقم التقييم", "Assessment ID")}: ${visit.assessment_id}</p>
                </div>
                <span class="v29-priority">${text("أولوية", "Priority")}: ${priority[lang]}</span>
              </div>
              <div class="v29-report-grid">
                <div class="v29-summary">
                  <h2>${text("المسار المعتمد", "Approved pathway")}</h2>
                  <div class="v29-value">${serviceOf(visit)}</div>
                </div>
                <div class="v29-summary">
                  <h2>${text("خطة المتابعة", "Follow-up plan")}</h2>
                  <p>${review.care_plan || text("حجز موعد للتقييم المتخصص.", "Book a specialist assessment.")}</p>
                </div>
              </div>
              ${renderDomains(visit, previous)}
            </article>`;
          })
          .join("");
      }

      function setLang(next) {
        lang = next;
        document.documentElement.lang = next;
        document.documentElement.dir = next === "ar" ? "rtl" : "ltr";
        document.querySelectorAll("[data-ar][data-en]").forEach((element) => {
          element.textContent = element.dataset[next];
        });
        $("#langBtn").textContent = next === "ar" ? "EN" : "ع";
        document.title = text("سجل متابعة الطفل | وصل", "Child follow-up history | WASL");
        render();
      }

      window.setLang = setLang;
      $("#langBtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");

      (async function initialize() {
        const all = await WASL_STORE.listAssessments();
        visits = all.filter((item) => item.status === "clinically_reviewed" && item.result && item.clinical_review);
        render();
      })();
    </script>
    <script src="assets/wasl-enhance.js"></script>
  </body>
</html>
