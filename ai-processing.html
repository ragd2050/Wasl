<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>جاري تحليل التقييم | وصل</title>
    <link rel="stylesheet" href="assets/wasl-fonts.css" />
    <link rel="stylesheet" href="assets/wasl-enhance.css" />
    <style>
      :root {
        --navy: #112d72;
        --violet: #5754e9;
        --blue: #1597ed;
        --cyan: #08d8d2;
        --bg: #f4f7fc;
        --muted: #6f7b90;
        --line: #dfe6f1;
        --soft: #f7f9fd;
        --green: #16865b;
        --red: #df4c60;
        --amber: #a55b12;
        --shadow: 0 20px 55px rgba(17, 45, 114, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Tajawal", sans-serif;
        color: #17213b;
        background: var(--bg);
      }
      .app {
        min-height: 100dvh;
        display: grid;
        grid-template-rows: 68px 1fr;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 clamp(24px, 5vw, 70px);
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        width: 126px;
        height: 48px;
        object-fit: contain;
      }
      .tools {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .secure {
        display: flex;
        align-items: center;
        gap: 7px;
        color: var(--green);
        font-size: 0.8rem;
      }
      .secure i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
      }
      .lang {
        height: 39px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--navy);
        font-weight: 800;
        cursor: pointer;
      }
      main {
        padding: 24px clamp(18px, 5vw, 70px);
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .shell {
        width: min(760px, 100%);
        padding: 30px clamp(22px, 4vw, 46px);
        border: 1px solid var(--line);
        border-radius: 25px;
        background: #fff;
        box-shadow: var(--shadow);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 13px;
        border-radius: 999px;
        background: #eef0ff;
        color: var(--violet);
        font-weight: 800;
        font-size: 0.75rem;
        margin-bottom: 14px;
      }
      .badge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--violet);
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }
      h1 {
        margin: 2px 0 6px;
        color: var(--navy);
        font-size: clamp(1.5rem, 2.5vw, 2.05rem);
      }
      .lead {
        color: var(--muted);
        line-height: 1.8;
        margin: 0 0 8px;
      }
      .engine {
        font-size: 0.76rem;
        color: #9198a8;
        margin: 0 0 18px;
      }
      .disclaimer {
        padding: 12px 15px;
        border-radius: 13px;
        background: #fff7ea;
        border: 1px solid #ffe3ad;
        color: var(--amber);
        font-size: 0.83rem;
        line-height: 1.7;
        font-weight: 600;
        margin-bottom: 20px;
      }
      .pbar {
        height: 9px;
        border-radius: 999px;
        background: #edf1f7;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .pbar i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan), var(--violet));
        transition: width 0.4s;
      }
      .stage {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 13px 0;
        border-bottom: 1px solid #eef1f7;
      }
      .stage:last-child {
        border-bottom: 0;
      }
      .stage .ic {
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: #eef1f7;
        color: #9aa5b6;
      }
      .stage .ic svg {
        width: 18px;
        height: 18px;
      }
      .stage .tx {
        flex: 1;
      }
      .stage .tx b {
        display: block;
        color: #3a4560;
        font-weight: 800;
        font-size: 0.95rem;
      }
      .stage .tx small {
        color: #9aa5b6;
        font-size: 0.72rem;
      }
      .stage.active .ic {
        background: #eef0ff;
        color: var(--violet);
      }
      .stage.active .tx b {
        color: var(--navy);
      }
      .stage.done .ic {
        background: #e8f7ef;
        color: var(--green);
      }
      .stage.failed .ic {
        background: #fdeef0;
        color: var(--red);
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .result-box {
        margin-top: 22px;
        display: none;
      }
      .result-box.show {
        display: block;
      }
      .result-box.ok {
      }
      .state-msg {
        padding: 16px;
        border-radius: 15px;
        font-weight: 700;
        line-height: 1.7;
      }
      .state-msg.ok {
        background: #e8f7ef;
        border: 1px solid #bfe6d2;
        color: #136c4c;
      }
      .state-msg.fail {
        background: #fdeef0;
        border: 1px solid #f2cdd4;
        color: #b23046;
      }
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .primary,
      .secondary {
        height: 48px;
        padding: 0 24px;
        border-radius: 13px;
        font:
          700 0.9rem "Tajawal",
          sans-serif;
        cursor: pointer;
      }
      .primary {
        min-width: 180px;
        border: 0;
        color: #fff;
        background: linear-gradient(105deg, var(--navy), var(--violet));
        box-shadow: 0 9px 20px rgba(87, 84, 233, 0.18);
      }
      .secondary {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--navy);
      }
      .demo-flag {
        text-align: center;
        background: #132a63;
        color: #dfe7ff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 4px;
        letter-spacing: 0.3px;
      }
      @media (max-width: 620px) {
        .logo {
          width: 104px;
        }
        .secure {
          display: none;
        }
        .btn-row .primary,
        .btn-row .secondary {
          width: 100%;
        }
      }
    </style>
    <script src="assets/wasl-store.js"></script>
    <script src="assets/wasl-api.js"></script>
    <script src="assets/wasl-sim.js"></script>
    <script defer src="assets/wasl-enhance.js"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <img class="logo" src="assets/wasl-logo-1.webp" alt="منصة وصل" />
        <div class="tools"><button class="lang" id="langBtn">EN</button></div>
      </header>
      <main>
        <section class="shell">
          <span class="badge"
            ><span class="dot"></span
            ><span id="badgeText" data-ar="التحليل جارٍ" data-en="Analysis running">التحليل جارٍ</span></span
          >
          <h1 data-ar="جاري تحليل التقييم" data-en="Assessment analysis in progress">جاري تحليل التقييم</h1>
          <p
            class="lead"
            data-ar="يجري الآن تحليل إجابات وتسجيلات الطفل لإعداد توصية أولية. لا تمثل هذه النتيجة تشخيصًا طبيًا، وسيقوم أخصائي مؤهل بمراجعتها."
            data-en="The child’s answers and recordings are being analyzed to prepare an initial recommendation. This result is not a medical diagnosis and will be reviewed by a qualified specialist."
          >
            يجري الآن تحليل إجابات وتسجيلات الطفل لإعداد توصية أولية. لا تمثل هذه النتيجة تشخيصًا طبيًا، وسيقوم أخصائي
            مؤهل بمراجعتها.
          </p>
          <p class="engine">WASL AI Speech-Language Triage Engine · <span id="engineVer"></span></p>
          <div class="disclaimer" id="simNote" style="display:none"
            data-ar="وضع محاكاة العرض: المراحل والنتيجة مُولّدة لعرض سير النظام فقط، ولا تعتمد على تحليل فعلي للصوت."
            data-en="Demo simulation: the stages and result are generated to demonstrate the system flow only and are not based on real audio analysis.">
            وضع محاكاة العرض: المراحل والنتيجة مُولّدة لعرض سير النظام فقط، ولا تعتمد على تحليل فعلي للصوت.
          </div>
          <div class="pbar"><i id="pbar"></i></div>
          <div id="stages"></div>
          <div class="result-box" id="resultBox">
            <div class="state-msg" id="stateMsg"></div>
            <div class="btn-row" id="btnRow"></div>
          </div>
        </section>
      </main>
    </div>
    <script>
      const $ = (s) => document.querySelector(s),
        $$ = (s) => document.querySelectorAll(s);
      let lang = "ar";
      if (window.WASL_SIM && WASL_SIM.isActive()) {
        const _n = document.getElementById("simNote");
        if (_n) _n.style.display = "block";
      }
      const STAGES = WASL_API.STAGES;
      let ptr = WASL_STORE.getResume();
      let ASSESS_ID = (ptr && ptr.assessment_id) || WASL_STORE.ensureAssessmentId("ai");
      let polling = null;
      let currentStage = 0;
      let failedStage = null;
      let currentMessage = null;

      function text(ar, en) {
        return lang === "ar" ? ar : en;
      }
      const IC_CHECK =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
      const IC_SPIN =
        '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>';
      const IC_DOT =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/></svg>';
      const IC_X =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';

      function renderStages(activeIdx, failedIdx) {
        currentStage = activeIdx;
        failedStage = failedIdx;
        $("#engineVer").textContent = WASL_API.MODEL_VERSION;
        $("#stages").innerHTML = STAGES.map((s, i) => {
          let cls = "",
            ic = IC_DOT;
          if (failedIdx != null && i === failedIdx) {
            cls = "failed";
            ic = IC_X;
          } else if (i < activeIdx) {
            cls = "done";
            ic = IC_CHECK;
          } else if (i === activeIdx) {
            cls = "active";
            ic = IC_SPIN;
          }
          return `<div class="stage ${cls}"><span class="ic">${ic}</span><div class="tx"><b>${text(s.label_ar, s.label_en)}</b><small>${s.component}</small></div></div>`;
        }).join("");
      }
      function setProgress(p) {
        $("#pbar").style.width = Math.round(p * 100) + "%";
      }

      async function start() {
        clearTimeout(polling);
        $("#resultBox").className = "result-box";
        $("#badgeText").textContent = text(
          "جارٍ الاتصال بمحرك التحليل",
          "Connecting to the analysis engine",
        );
        renderStages(0, null);
        setProgress(0.02);
        try {
          await WASL_API.health();
          $("#badgeText").textContent = text(
            "التحليل جارٍ",
            "Analysis running",
          );
          await WASL_API.analyze(ASSESS_ID);
        } catch (e) {
          return showFail(0, e);
        }
        schedulePoll(0);
      }

      function schedulePoll(delay) {
        clearTimeout(polling);
        polling = setTimeout(poll, delay);
      }

      async function poll() {
        let st;
        try {
          st = await WASL_API.analysisStatus(ASSESS_ID);
        } catch (e) {
          showFail(currentStage, e);
          return;
        }

        if (st.status === "queued") {
          setProgress(Math.max(st.progress || 0, 0.03));
          schedulePoll(700);
          return;
        }

        if (st.status === "processing") {
          renderStages(st.stage_index, null);
          setProgress(st.progress);
          schedulePoll(700);
          return;
        }

        if (st.status === "failed") {
          showFail(st.stage_index, st);
          return;
        }

        if (st.status === "completed") {
          renderStages(STAGES.length, null);
          setProgress(1);
          await showDone();
          return;
        }

        showFail(currentStage, {
          error_ar: "أعاد محرك التحليل حالة غير متوقعة. يرجى إعادة المحاولة.",
          error_en: "The analysis engine returned an unexpected state. Please retry.",
        });
      }

      function showFail(stageIdx, st) {
        clearTimeout(polling);
        currentMessage = st || null;
        renderStages(stageIdx, stageIdx);
        $("#badgeText").textContent = text("تعذّر التحليل", "Analysis failed");
        const box = $("#resultBox");
        box.className = "result-box show";
        $("#stateMsg").className = "state-msg fail";
        $("#stateMsg").textContent =
          (st && text(st.error_ar, st.error_en)) ||
          text("حدث خطأ أثناء التحليل. يرجى إعادة المحاولة.", "An error occurred during analysis. Please retry.");
        $("#btnRow").innerHTML =
          `<button class="primary" id="retryBtn">${text("إعادة المحاولة", "Retry")}</button><button class="secondary" id="backBtn">${text("العودة للمراجعة", "Back to review")}</button>`;
        $("#retryBtn").onclick = () => start(false);
        $("#backBtn").onclick = () => (location.href = "review.html");
      }
      async function showDone() {
        $("#badgeText").textContent = text("اكتمل التحليل", "Analysis complete");
        try {
          await WASL_API.getResult(ASSESS_ID);
        } catch (e) {
          showFail(STAGES.length - 1, e);
          return;
        }
        currentMessage = null;
        WASL_STORE.setResume({
          assessment_id: ASSESS_ID,
          url: "clinical-review.html",
          step: "clinical_review",
          label_ar: "بانتظار مراجعة الأخصائي",
          label_en: "Awaiting specialist review",
        });
        const box = $("#resultBox");
        box.className = "result-box show";
        $("#stateMsg").className = "state-msg ok";
        $("#stateMsg").textContent = text(
          "تم إعداد التوصية الأولية بنجاح. النتيجة النهائية تخضع لمراجعة الأخصائي.",
          "The initial recommendation is ready. The final result is subject to specialist review.",
        );
        $("#btnRow").innerHTML =
          `<button class="primary" id="goBtn">${text("الانتقال إلى مراجعة الأخصائي", "Continue to specialist review")}</button>`;
        $("#goBtn").onclick = () => (location.href = "specialist-login.html");
      }
      window.setLang = function (n) {
        lang = n;
        document.documentElement.lang = n;
        document.documentElement.dir = n === "ar" ? "rtl" : "ltr";
        document.querySelectorAll("[data-ar][data-en]").forEach((e) => (e.textContent = e.dataset[n]));
        const lb = $("#langBtn");
        if (lb) lb.textContent = n === "ar" ? "EN" : "ع";
        document.title = text("جاري تحليل التقييم | وصل", "Assessment analysis in progress | WASL");
        renderStages(currentStage, failedStage);
        if (failedStage !== null && currentMessage) {
          showFail(failedStage, currentMessage);
        }
      };
      $("#langBtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");
      window.addEventListener("beforeunload", () => clearTimeout(polling));
      start();
    </script>
  </body>
</html>
